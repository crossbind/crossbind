packages:
  - 'core/*'
  - 'core/embind-rust/demo'
  - 'tooling/*'
  - 'plugins/*'
  - 'ports/*/*'
  - 'examples/*'
  - 'e2e/*'
  - 'landing'
  - '!**/test/**'
allowBuilds:
  '@swc/core': true
  core-js: false
  electron-winstaller: false
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - wrangler@4.136.3
overrides:
  '@hono/node-server@2': '^2.1.0'
  '@xmldom/xmldom@0.8': '^0.8.15'
  '@xmldom/xmldom@0.9': '^0.9.12'
  'body-parser@1': '^1.20.6'
  'body-parser@2': '^2.4.0'
  'brace-expansion@1': '^1.1.21'
  'brace-expansion@2': '^2.1.4'
  'brace-expansion@5': '^5.0.12'
  'compression@1': '^1.8.2'
  'dompurify@3': '^3.4.13'
  'fast-uri@3': '^3.1.9'
  'hono@4': '^4.13.1'
  'http-proxy-middleware@2': '^2.0.10'
  'ip-address@10': '^10.4.0'
  'joi@17': '^17.13.6'
  'js-yaml@3': '^3.15.2'
  'js-yaml@4': '^4.3.2'
  'launch-editor@2': '^2.14.2'
  'mermaid@11': '^11.16.1'
  # The Expo sample's SDK decides these three, and the CLI samples follow it: move them together with
  # an SDK upgrade. The plugins take them as peers, and a plugin's own copy beside the app's means the
  # wrong metro ends up serving and the Expo config plugin runs on another SDK's helpers. Pinning them
  # here keeps this workspace's graph single-valued without narrowing what the published packages
  # accept.
  '@expo/config-plugins': '~58.0.10'
  metro: '^0.87.1'
  react-native: '0.88.0'
  'minimatch@3': '^3.1.4'
  'nanoid@3': '^3.3.18'
  'on-headers@1': '^1.1.0'
  'postcss@8': '^8.5.26'
  'qs@6': '^6.15.2'
  serialize-javascript: '^7.0.5'
  sharp: '^0.35.4'
  shell-quote: '^1.10.0'
  'source-map-js@1': '^1.2.2'
  'svgo@3': '^3.3.4'
  'undici@6': '^6.29.1'
  'undici@7': '^7.30.1'
  uuid: '^11.1.1'
  'vite@8': '^8.3.3'
  'webpack-dev-server@5': '^5.2.6'
  websocket-driver: '^0.7.5'
  'ws@6': '^6.2.6'
  'ws@7': '^7.5.13'
  'zod@4': '^4.6.6'
  # @expo/cli 58 asks for zod ^3.25.76, and no 3.x release fixes GHSA-mrhx-c7xc-m3w5. Its two schemas use
  # only what zod 4 keeps (object, string, enum, safeParse, error.issues). Drop this once it moves to zod 4.
  '@expo/cli>zod': '^4.6.6'
