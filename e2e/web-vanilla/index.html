<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <title>crossbind Vanilla playground</title>
    <script src="./dist/crossbind-e2e-web-vanilla-wasm-wasm32-mt-release.browser.js"></script>
    <script>
        // No ops_JSPI here: this playground builds the mt (pthreads) browser
        // runtime, which cannot carry -sJSPI, so the JSPI demo binding is
        // guarded out of the build. The mt demo is the thread roundtrip below.
        // await keeps the calls correct in both modes: the browser runtime
        // defaults to useWorker, where every binding returns a Promise.
        initNative({ path: './dist' }).then(async ({ Native }) => {
            await Native.runOnThread();
            document.querySelector('#cppMessage').innerHTML = 'ready (pthreads)';
            document.querySelector('#threadResult').innerHTML = await Native.getThreadResult();
        });
    </script>
    <script type="module">
        // Shared conformance list, no bundler: the build copies the spec next to the glue
        // (dist/conformance/). The browser runtime defaults to useWorker, so worker
        // contracts apply and live-JS stays a documented skip. initNative reuses the boot
        // started by the classic script above (single-boot promise).
        import { runConformance } from './dist/conformance/run.mjs';

        const m = await initNative({ path: './dist' });
        try {
            const result = await runConformance({
                cpp: { ConfBox: m.ConfBox, ConfCircle: m.ConfCircle, ConfOps: m.ConfOps },
                rustPkg: {
                    RustyCounter: m.RustyCounter,
                    Widget: m.Widget,
                    Gauge: m.Gauge,
                    Mode: m.Mode,
                    RustIntVector: m.RustIntVector,
                    doubleIt: m.doubleIt,
                    greet: m.greet,
                    checkedParse: m.checkedParse,
                    parseEven: m.parseEven,
                    tag: m.tag,
                    jsonEcho: m.jsonEcho,
                    jsonTally: m.jsonTally,
                    jsonPick: m.jsonPick,
                    SharedDoc: m.SharedDoc,
                    dupDoc: m.dupDoc,
                    sharedDropCount: m.sharedDropCount,
                },
                rustAppLocal: null,
                rustCrates: null,
                jsLive: null,
                pointers: m,
                callbacks: m,
                strings: m,
                wrappers: m,
                types: m,
                rustKit: m,
                caps: { worker: true },
            });
            const firstBad = result.lines.find((l) => l.startsWith('NO'));
            if (firstBad) console.log(`CONF LINES:\n${result.lines.join('\n')}`);
            document.querySelector('#conf').innerHTML = firstBad ? `${result.summary} | ${firstBad}` : result.summary;
        } catch (e) {
            document.querySelector('#conf').innerHTML = `CONFORMANCE ERR: ${e?.message ?? e}`;
        }
    </script>
    <style>
        body {
            padding: 50px;
        }

        table,
        th,
        td {
            border: 1px solid red;
            border-collapse: collapse;
        }

        table {
            width: 400px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <p>Matrix multiplier with c++ &nbsp;&nbsp;=&gt;&nbsp;&nbsp; <span id="cppMessage">compiling ...</span></p>
    <p>Thread result &nbsp;&nbsp;:&nbsp;&nbsp; <span id="threadResult">...</span></p>
    <p><span id="conf">conformance: running ...</span></p>
</body>

</html>
