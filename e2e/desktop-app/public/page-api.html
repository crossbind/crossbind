<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>page api</title>
</head>
<body>
<script>
// A page of the project's origin, which src/served-origins.js opens there, with no crossbind.js of the app's: it imports
// crossbind/app from /__crossbind/app.js, which the host answers from the app's own files, and tells the app's page what
// it got. An app's function is refused naming the page's role, also once globalThis.Crossbind is what a web build's
// crossbind.js makes it; dialog.message, which the role project reaches, shows the system's dialog, which waits for its
// user until the probe closes it, and which goes as its call is cancelled, also with another dialog of its window. At
// its end the page leaves a message dialog up, and its own alert() over it.
(async () => {
    const QUIET_MS = 3000;
    const ANSWER_MS = 10000;
    // When the origin ends, from a thread of the probe's, as its dialogs wait; how long the page gives the end's call to go
    // out where its answer is held; and how long it waits for the app's page before it says it did not come.
    const END_AFTER_MS = 3000;
    const SENT_MS = 500;
    const STAYED_MS = 10000;
    const MESSAGE = "crossbind e2e: a project's dialog";
    const ENDED = "crossbind e2e: a project's dialog its end closes";
    // The probe's dialog of the window, as another holder's, and the message dialogs asked with it up.
    const OTHER = 'crossbind e2e: another dialog of the window';
    const BEHIND = "crossbind e2e: a project's dialog asked behind another";
    const UNDER = "crossbind e2e: a project's dialog under another";
    const name = location.hostname.split('.')[0];
    const failure = (error) => `${error?.name ?? 'Error'}: ${error?.message ?? error}`;
    const answered = (promise) => promise.then((value) => `answered ${JSON.stringify(value)}`, failure);
    const within = (promise, ms, otherwise) => Promise.race([promise, new Promise((resolve) => { setTimeout(() => resolve(otherwise), ms); })]);
    const sleep = (ms) => new Promise((resolve) => { setTimeout(resolve, ms); });
    let api;
    try {
        api = await import('/__crossbind/app.js');
    } catch (error) {
        const asked = await fetch('/__crossbind/app.js').then(async (response) => `${response.status} ${(await response.text()).slice(0, 200)}`, failure);
        console.error(`CONFORMANCE ERR: ${location.origin}: /__crossbind/app.js did not import, ${failure(error)}; it answered ${asked}`);
        return;
    }
    // Whether a dialog of the message shows, which the probe closes if it does.
    const isShown = (message) => api.invoke('probe.closeDialog', { message }).then((closed) => closed.isShown, failure);
    // macOS shows a sheet asked while another shows over the same window once that one ends, and iOS an alert over the
    // alert on top: a message dialog whose call is cancelled goes, behind the other or under it, and never shows later.
    // Two message dialogs are never up together: the second is refused.
    async function withAnother() {
        const another = {};
        await api.invoke('probe.sheet', { message: OTHER });
        const behind = new AbortController();
        const behindAnswer = answered(api.invoke('dialog.message', { message: BEHIND }, { signal: behind.signal }));
        // The host takes the calls in order and shows a dialog on the main thread before it answers the next: once this
        // answers, the message dialog waits behind the other.
        await api.invoke('probe.role');
        behind.abort();
        another.behindAnswer = await within(behindAnswer, ANSWER_MS, 'no answer');
        // Once what shows settles: an alert of iOS closes as its presentation ends, and a sheet of macOS waits.
        await sleep(QUIET_MS);
        another.behind = await isShown(BEHIND);
        another.other = await isShown(OTHER);
        await sleep(QUIET_MS);
        another.behindLater = await isShown(BEHIND);
        const under = new AbortController();
        const underAnswer = answered(api.invoke('dialog.message', { message: UNDER }, { signal: under.signal }));
        another.underShown = await within(underAnswer, QUIET_MS, 'shown');
        another.second = await answered(api.invoke('dialog.message', { message: 'crossbind e2e: a second message dialog' }));
        await api.invoke('probe.sheet', { message: OTHER });
        under.abort();
        another.underAnswer = await within(underAnswer, ANSWER_MS, 'no answer');
        await sleep(QUIET_MS);
        another.under = await isShown(UNDER);
        another.otherAfter = await isShown(OTHER);
        return another;
    }
    const got = { names: Object.keys(api).sort() };
    try {
        got.role = await api.invoke('probe.role');
        got.paths = await answered(api.app.paths());
        globalThis.Crossbind = { initNative: () => Promise.resolve({}) };
        got.pathsAfter = await answered(api.app.paths());
        const shown = answered(api.dialog.message({ message: MESSAGE }));
        got.dialog = await within(shown, QUIET_MS, 'shown');
        if (got.dialog === 'shown') {
            got.mainThread = await within(answered(api.invoke('probe.onMainThread')), QUIET_MS, 'held');
            // On Android a close sent for another call's message dialog leaves this one up.
            if (api.device.platform === 'android') got.closedAnother = await answered(api.invoke('probe.closeAnotherMessage'));
            got.closed = await api.invoke('probe.closeDialog', { message: MESSAGE }).catch(failure);
            got.dialogClosed = await within(shown, ANSWER_MS, 'no answer once closed');
        }
        if (['macos', 'ios'].includes(api.device.platform)) got.another = await withAnother();
    } catch (error) {
        got.failure = failure(error);
    }
    try {
        await api.invoke('probe.report', { key: 'pageApi', value: got });
        await api.invoke('probe.setStage', { stage: 'page-api-done' });
        setTimeout(() => console.error(`CONFORMANCE ERR: ${location.origin}: the window still shows the project ${STAYED_MS} ms after its origin ended`), STAYED_MS);
        api.dialog.message({ message: ENDED }).catch(() => {});
        // Once the message dialog shows, which on Windows holds the queue of the window's thread through which the page's
        // dialog reaches its holder: one asked then waits in it, and the end comes first.
        await within(answered(api.invoke('probe.onMainThread')), QUIET_MS, 'held');
        // The end's call goes out before alert() holds the page's script, which would hold it too: answered at once, or a
        // moment on where the task dialog holds its answer.
        await within(answered(api.invoke('probe.endOrigin', { name, afterMs: END_AFTER_MS })), SENT_MS, 'held');
        alert('wait over');
    } catch (error) {
        console.error(`CONFORMANCE ERR: ${location.origin}: /__crossbind/app.js could not tell the app's page what it got, ${failure(error)}: ${JSON.stringify(got)}`);
    }
})();
</script>
</body>
</html>
