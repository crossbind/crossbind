<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- This file is the template for every prerendered route, so only tags that are the same on
         all of them live here. Title, description, canonical, og:title/description/url and the
         twitter text tags are written per route by src/main.jsx; a copy here would duplicate
         itself onto all sixteen pages. The title below is the dev-server fallback and mirrors
         SITE_TITLE in src/data.js. -->
    <title>crossbind · build and ship JS apps, add C++ and Rust as needed</title>
    <meta name="theme-color" content="#ffffff" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="crossbind" />
    <meta property="og:image" content="https://crossbind.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="crossbind: build and ship JS apps, add C++ and Rust as needed" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://crossbind.dev/og.png" />

    <script>
        // The site opens light; only a visitor who chose dark gets dark. The prerendered markup carries
        // the light default, so that visitor would see a light flash until hydration: painting the
        // canvas and the browser's bar here, before first paint, softens it. Mirrors src/theme.js:
        // THEME_KEY and darkTokens().bg. An inline script cannot import them, so change them together.
        try {
            if (localStorage.getItem('crossbind.landing.theme') === 'dark') {
                document.documentElement.style.background = '#22262e';
                document.documentElement.style.colorScheme = 'dark';
                document.querySelector('meta[name="theme-color"]').setAttribute('content', '#22262e');
            }
        } catch (e) { /* private mode blocks storage; the light default stands */ }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" prerender src="/src/main.jsx"></script>
</body>
</html>
