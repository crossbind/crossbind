<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>crossbind - geos from JavaScript only</title>
    <script src="./dist/geosdirect-wasm-wasm32-st-release.browser.js"></script>
</head>

<body>
    <pre id="out">compiling ...</pre>
    <script type="module">
        // The "JavaScript only" versions of the usage examples on crossbind.dev/ports/geos/: no C++,
        // only GEOS's own C header as crossbind binds it. The demo build opens this page; every example
        // that can work this way must print exactly its `expected`. One that cannot says why instead
        // and has nothing to run.
        import * as overlay from './examples/01-overlay.js';
        import * as zone from './examples/02-zone.js';
        import * as measure from './examples/03-measure.js';
        import * as buffer from './examples/04-buffer.js';
        import * as validity from './examples/05-validity.js';

        const EXAMPLES = [overlay, zone, measure, buffer, validity].filter((example) => example.default);

        const out = document.querySelector('#out');
        const lines = [];
        const show = (text) => {
            lines.push(text);
            out.textContent = lines.join('\n');
        };
        const checks = [];
        const check = (name, actual, expected) => {
            const ok = JSON.stringify(actual) === JSON.stringify(expected);
            checks.push(ok);
            show(`${ok ? 'ok  ' : 'FAIL'} ${name}: ${JSON.stringify(actual)}${ok ? '' : ` (expected ${JSON.stringify(expected)})`}`);
        };

        try {
            const m = await initNative({ path: './dist' });
            for (const example of EXAMPLES) {
                const printed = [];
                await example.default(m, { log: (...values) => printed.push(values.map(String).join(' ')) });
                check(`example "${example.expected[0]}"`, printed, example.expected);
            }
            const passed = checks.filter(Boolean).length;
            show(`geos ${await m.GEOSversion()} => ${passed}/${checks.length} checks passed`);
        } catch (error) {
            show(`failed => ${error?.stack ?? error}`);
        }
    </script>
</body>

</html>
