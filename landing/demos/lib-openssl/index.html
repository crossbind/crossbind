                const value = der.slice(at + 2, at + 2 + length);
                const trimmed = value[0] === 0 ? value.slice(1) : value;
                const padded = new Uint8Array(32);
                padded.set(trimmed, 32 - trimmed.length);
                return { value: padded, next: at + 2 + length };

            const r = integer(2);
            const s = integer(r.next);
            return new Uint8Array([...r.value, ...s.value]);

            const classic = await run('ED25519', 'X25519', false, false, false);
            const quantum = await run('ED25519', 'MLKEM768', false, false, false);
            check('app tls key exchange groups', [classic.group, classic.clientShares, classic.serverShare, quantum.group, quantum.clientShares, quantum.serverShare], ['x25519', [{ group: 'x25519', bytes: 32 }], 32, 'MLKEM768', [{ group: 'MLKEM768', bytes: 1184 }], 1088]);
            const mldsa = await run('ML-DSA-65', '', false, false, false);
            check('app tls ML-DSA-65 certificate', [mldsa.ok, mldsa.signature, mldsa.verify, mldsa.certificate, mldsa.messages.find((message) => message.type === 'CertificateVerify').bytes], [true, 'mldsa65', 'ok', 'ML-DSA-65', 3317]);
            const older = await run('P-256', '', true, false, false);
            check('app tls 1.2 for comparison', [older.ok, older.version, older.cipher, older.signature, older.secretNameOnWire, older.messages.filter((message) => message.from === 'server' && !message.encrypted).map((message) => message.type)], [true, 'TLSv1.2', 'ECDHE-ECDSA-AES256-GCM-SHA384', 'ecdsa_secp256r1_sha256', 3, ['ServerHello', 'Certificate', 'ServerKeyExchange', 'ServerHelloDone', 'NewSessionTicket', 'ChangeCipherSpec']]);

            // PFX unpacker, on the host's files and on files it packs itself.
            const pfx = await new m.PfxTool();
            const modern = JSON.parse(await pfx.unpack(MODERN_P12, P12_PASSWORD));
            const MODERN_SAFES = ['PKCS7 Encrypted data: PBES2, PBKDF2, AES-256-CBC, Iteration 2048, PRF hmacWithSHA256', 'Certificate bag', 'Certificate bag', 'PKCS7 Data', 'Shrouded Keybag: PBES2, PBKDF2, AES-256-CBC, Iteration 2048, PRF hmacWithSHA256'];
            check('app pfx host file, as openssl pkcs12 -info describes it', [modern.legacyProvider, modern.mac, modern.safes, modern.friendlyName, modern.keyType, modern.certificate.fingerprint, modern.chain.map((cert) => cert.subject), modern.keyMatches], [false, 'sha256, Iteration 2048', MODERN_SAFES, 'shop.example.com', 'EC prime256v1', shop.fingerprint, ['CN=Example Shop Test CA,O=Example Shop,C=US'], true]);
            const LEGACY_SAFES = ['PKCS7 Encrypted data: pbeWithSHA1And40BitRC2-CBC, Iteration 2048', 'Certificate bag', 'Certificate bag', 'PKCS7 Data', 'Shrouded Keybag: pbeWithSHA1And3-KeyTripleDES-CBC, Iteration 2048'];
            const legacy = JSON.parse(await pfx.unpack(LEGACY_P12, P12_PASSWORD));
            const again = JSON.parse(await pfx.unpack(LEGACY_P12, P12_PASSWORD));
            check('app pfx legacy host file needs the legacy provider, every time', [legacy.legacyProvider, legacy.withoutLegacy, legacy.mac, legacy.safes, legacy.certificate.fingerprint, legacy.keyMatches, again.legacyProvider], [true, 'error:0308010C:digital envelope routines::unsupported', 'sha1, Iteration 2048', LEGACY_SAFES, shop.fingerprint, true, true]);
            let refused = '';
            try {
                await pfx.unpack(MODERN_P12, 'wrong password');
            } catch (error) {
                refused = error.message;
            }
            check('app pfx wrong password', refused, 'std::runtime_error: wrong password: the file\'s MAC does not verify');
            const trips = [];
            for (const old of [false, true]) {
                const packed = JSON.parse(await pfx.unpack(await pfx.pack(edKey, localhost, CA_PEM, 'pass', 'localhost', old), 'pass'));
                trips.push([packed.legacyProvider, packed.mac, packed.safes[0], packed.friendlyName, packed.certificate.fingerprint, packed.chain.length, packed.keyMatches]);
            }
            check('app pfx round trips', trips, [
                [false, 'sha256, Iteration 2048', MODERN_SAFES[0], 'localhost', made.fingerprint, 1, true],
                [true, 'sha1, Iteration 2048', LEGACY_SAFES[0], 'localhost', made.fingerprint, 1, true],
            ]);

            const passed = checks.filter(Boolean).length;
            show(`openssl ${version} => ${passed}/${checks.length} checks passed`);
        } catch (error) {
            show(`failed => ${error && error.message ? error.message : error}`);
        }
    </script>
