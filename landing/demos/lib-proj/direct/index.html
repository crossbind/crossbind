<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>crossbind - PROJ from JavaScript only</title>
    <script src="./dist/projdirect-wasm-wasm32-st-release.browser.js"></script>
</head>

<body>
    <pre id="out">compiling ...</pre>
    <script type="module">
        // The "JavaScript only" versions of the usage examples on crossbind.dev/ports/proj/: no C++,
        // only PROJ's own headers as crossbind binds them. The demo build opens this page; every example
        // that can work this way must print exactly its `expected`. One that cannot says why instead
        // and has nothing to run.
        import * as transform from './examples/01-transform.js';
        import * as formats from './examples/02-formats.js';
        import * as areaAxes from './examples/03-area-axes.js';
        import * as geodesic from './examples/04-geodesic.js';
        import * as identify from './examples/05-identify.js';

        const EXAMPLES = [transform, formats, areaAxes, geodesic, identify].filter((example) => example.default);

        const out = document.querySelector('#out');
        const lines = [];
        const show = (text) => {
            lines.push(text);
            out.textContent = lines.join('\n');
        };
        const checks = [];
        const check = (name, actual, expected) => {
            const ok = JSON.stringify(actual) === JSON.stringify(expected);
            checks.push(ok);
            show(`${ok ? 'ok  ' : 'FAIL'} ${name}: ${JSON.stringify(actual)}${ok ? '' : ` (expected ${JSON.stringify(expected)})`}`);
        };

        try {
            const m = await initNative({ path: './dist' });
            for (const example of EXAMPLES) {
                const printed = [];
                await example.default(m, { log: (...values) => printed.push(values.map(String).join(' ')) });
                check(`example "${example.expected[0]}"`, printed, example.expected);
            }
            const passed = checks.filter(Boolean).length;
            // PJ_INFO's version string is a `const char *` field, which crossbind does not bind; its numbers are.
            const info = await m.proj_info();
            show(`proj ${await info.major}.${await info.minor}.${await info.patch} => ${passed}/${checks.length} checks passed`);
        } catch (error) {
            show(`failed => ${error?.stack ?? error}`);
        }
    </script>
</body>

</html>
