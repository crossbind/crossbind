<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>crossbind - libgeotiff self-check</title>
    <script src="./dist/geotiffapps-wasm-wasm32-st-release.browser.js"></script>
</head>

<body>
    <pre id="out">compiling ...</pre>
    <script type="module">
        // Every usage example and every app on crossbind.dev/ports/geotiff/ runs on this module. This
        // page is what the demo build opens to prove them: each example must print exactly what its
        // `expected` says, and the apps must give what the host's own listgeo, GDAL and PROJ, the
        // Krueger series for transverse Mercator and a Python model of the generated terrain gave for
        // the same files.
        import * as locate from './examples/01-locate.js';
        import * as write from './examples/02-write.js';
        import * as keys from './examples/03-keys.js';
        import * as definition from './examples/04-definition.js';
        import * as pixels from './examples/05-pixels.js';

        const EXAMPLES = [locate, write, keys, definition, pixels];

        // The georeferencer's sample: fields, a river and noise, from integer arithmetic only, so
        // every JavaScript engine makes the same bytes.
        function samplePicture(width, height) {
            let seed = 20260924;
            const random = () => (seed = (seed * 48271) % 2147483647) % 19;
            const fields = [[112, 140, 74], [150, 160, 90], [186, 170, 120], [96, 120, 70], [134, 150, 84]];
            const rgba = new Uint8Array(width * height * 4);
            for (let y = 0; y < height; y += 1) {
                for (let x = 0; x < width; x += 1) {
                    const bend = Math.abs((x % 160) - 80) / 2;
                    const river = Math.abs(y - height / 3 - bend) < 5;
                    const [r, g, b] = river ? [74, 112, 150] : fields[(Math.floor(x / 48) * 7 + Math.floor(y / 40) * 3) % fields.length];
                    const shade = random() - 9;
                    rgba.set([r + shade, g + shade, b + shade, 255], (y * width + x) * 4);
                }
            }
            return rgba;
        }

        const out = document.querySelector('#out');
        const lines = [];
        const show = (text) => {
            lines.push(text);
            out.textContent = lines.join('\n');
        };
        const sha256 = async (bytes) => [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))].map((b) => b.toString(16).padStart(2, '0')).join('');
        const fixed = (values, digits) => values.map((value) => value.toFixed(digits));
        // listgeo's text as the host tool prints it, compared without trailing spaces and blank lines.
        const normalised = (text) => text.split('\n').map((line) => line.trimEnd()).join('\n').trim();

        const checks = [];
        const check = (name, actual, expected) => {
            const ok = expected !== null && JSON.stringify(actual) === JSON.stringify(expected);
            checks.push(ok);
            show(`${ok ? 'ok  ' : 'FAIL'} ${name}: ${JSON.stringify(actual)}${ok ? '' : ` (expected ${JSON.stringify(expected)})`}`);
        };

        try {
            const m = await initNative({ path: './dist' });
            const version = await m.GeoTiffInspector.version();

            // The usage examples, run exactly as the page shows them.
            for (const example of EXAMPLES) {
                const printed = [];
                await example.default(m, { log: (...values) => printed.push(values.map(String).join(' ')) });
                check(`example "${example.title}"`, printed, example.expected);
            }

            // Where is this GeoTIFF? The four samples, then a file that is not a TIFF.
            const dir = await m.getRandomPath('/memfs');
            const expectedSamples = {
                istanbul: [17770, 32635, 'WGS 84 / UTM zone 35N', '1830 x 1830', 'Deflate', '28.198970', '41.545594', '29.477198', '40.536186', 64],
                london: [7376, 27700, 'OSGB36 / British National Grid', '1000 x 1000', 'Deflate', '-0.123051', '51.593357', '0.017257', '51.501092', 64],
                conus: [9667, 5070, 'NAD83 / Conus Albers', '1612 x 1045', 'Deflate', '-130.232828', '48.707396', '-73.596878', '22.055611', 64],
                world: [1256, 4326, 'WGS 84', '360 x 180', 'Deflate', '-180.000000', '90.000000', '180.000000', '-90.000000', 64],
            };
            let istanbulReport = '';
            for (const id of Object.keys(expectedSamples)) {
                const path = `${dir}/${id}.tif`;
                const bytes = await m.GeoTiffInspector.writeSample(id, path);
                const info = JSON.parse(await m.GeoTiffInspector.inspect(path));
                const [upperLeft, , lowerRight] = info.corners;
                if (id === 'istanbul') istanbulReport = info.listgeo;
                check(`app inspector ${id}`, [bytes, info.epsg, info.name, `${info.file.width} x ${info.file.height}`, info.file.compression, ...fixed(upperLeft.lonLat, 6), ...fixed(lowerRight.lonLat, 6), info.outline.length], expectedSamples[id]);
            }
            check('app inspector listgeo report sha-256', await sha256(new TextEncoder().encode(normalised(istanbulReport))), '8106f8eb12650c8d447d29e0b45c188a7b4f580241e889d04c11fee7c5b5c8a7');
            await m.FS.writeFile(`${dir}/notes.txt`, 'not a picture');
            try {
                await m.GeoTiffInspector.inspect(`${dir}/notes.txt`);
                check('app inspector rejects a text file', 'opened', 'Not a TIFF or MDI file, bad magic number 28526 (0x6f6e)');
            } catch (error) {
                check('app inspector rejects a text file', error.message.slice(error.message.lastIndexOf(': ') + 2), 'Not a TIFF or MDI file, bad magic number 28526 (0x6f6e)');
            }

            // Georeference a picture: the sample over Istanbul, in every compression, then read back.
            const [width, height] = [384, 256];
            await m.FS.writeFile(`${dir}/picture.rgba`, samplePicture(width, height));
            const sizes = [];
            const backs = [];
            for (const compression of ['none', 'deflate', 'lzw', 'zstd', 'jpeg']) {
                const tif = `${dir}/picture-${compression}.tif`;
                const written = JSON.parse(await m.Georeferencer.write(`${dir}/picture.rgba`, width, height, 4326, 28.6, 41.3, 0.8 / width, 0.5 / height, compression, 85, tif));
                const back = JSON.parse(await m.GeoTiffInspector.inspect(tif));
                sizes.push(written.bytes);
                backs.push(`${back.file.compression} ${back.file.bands} EPSG:${back.epsg} ${fixed(back.corners[0].lonLat, 9)} ${fixed(back.corners[2].lonLat, 9)}`);
            }
            check('app georeferencer sizes', sizes, [295368, 101434, 132690, 105162, 21002]);
            check('app georeferencer read back', backs, ['none', 'Deflate', 'LZW', 'ZSTD', 'JPEG'].map((name) => `${name} 3 EPSG:4326 28.600000000,41.300000000 29.400000000,40.800000000`));
            const utm = JSON.parse(await m.Georeferencer.write(`${dir}/picture.rgba`, width, height, 32635, 650000, 4560000, 100, 100, 'deflate', 85, `${dir}/picture-utm.tif`));
            const utmBack = JSON.parse(await m.GeoTiffInspector.inspect(`${dir}/picture-utm.tif`));
            check('app georeferencer projected', [utm.name, ...fixed(utmBack.corners[0].lonLat, 6), ...fixed(utmBack.corners[2].lonLat, 6)], ['WGS 84 / UTM zone 35N', '28.788325', '41.177472', '29.238007', '40.939025']);
            const clear = samplePicture(width, height);
            for (let i = 3; i < clear.length; i += 4 * 7) clear[i] = 0;
            await m.FS.writeFile(`${dir}/clear.rgba`, clear);
            const withAlpha = JSON.parse(await m.Georeferencer.write(`${dir}/clear.rgba`, width, height, 4326, 28.6, 41.3, 0.8 / width, 0.5 / height, 'deflate', 85, `${dir}/clear.tif`));
            let refused = '';
            try {
                await m.Georeferencer.write(`${dir}/picture.rgba`, width, height, 5773, 0, 0, 1, 1, 'deflate', 85, `${dir}/refused.tif`);
            } catch (error) {
                refused = error.message;
            }
            check('app georeferencer alpha and refusals', [withAlpha.bands, withAlpha.alpha, refused], [4, true, "std::invalid_argument: EPSG:5773 is neither a projected nor a geographic system in PROJ's database"]);

            // Elevation probe: the synthetic DEM, its grid, a position and five encodings.
            const dem = `${dir}/dem.tif`;
            const demBytes = await m.DemProbe.writeSample(dem);
            const probe = await new m.DemProbe(dem, 512);
            const demInfo = JSON.parse(await probe.info());
            check('app dem sample', [demBytes, demInfo.gridWidth, demInfo.gridHeight, demInfo.min, demInfo.max, demInfo.mean.toFixed(6), demInfo.valid, demInfo.name], [607670, 512, 512, 419.06817626953125, 2371.43212890625, '860.583281', 262144, 'WGS 84 / UTM zone 33N']);
            await probe.writeGrid(`${dir}/grid.f32`);
            check('app dem heights sha-256', await sha256(await m.getFileBytes(`${dir}/grid.f32`)), 'd8115dce3810d3dbf30b49519baa07e7bc29ce40dc69d511eba731675854aba8');
            const spot = JSON.parse(await probe.at(100.5, 200.5));
            check('app dem position', [...spot.map, ...fixed(spot.lonLat, 9)], [413015, 5213985, '13.854264880', '47.073645579']);
            const encodings = [];
            for (const [codec, budget] of [['deflate', 0], ['zstd', 0], ['lerc', 0.01], ['lerc', 0.1], ['lerc', 1]]) {
                const result = JSON.parse(await probe.encode(codec, budget, `${dir}/dem-${codec}-${budget}.tif`));
                encodings.push(`${codec} ${budget}: ${result.bytes} B, max change ${result.maxError}`);
            }
            check('app dem encodings', encodings, [
                'deflate 0: 607670 B, max change 0',
                'zstd 0: 596240 B, max change 0',
                'lerc 0.01: 392042 B, max change 0.010009765625',
                'lerc 0.1: 283298 B, max change 0.100006103515625',
                'lerc 1: 176730 B, max change 1',
            ]);

            const passed = checks.filter(Boolean).length;
            show(`geotiff ${version} => ${passed}/${checks.length} checks passed`);
        } catch (error) {
            show(`failed => ${error && error.message ? error.message : error}`);
        }
    </script>
</body>

</html>
