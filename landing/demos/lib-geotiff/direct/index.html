<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>crossbind - libgeotiff from JavaScript only</title>
    <script src="./dist/geotiffdirect-wasm-wasm32-st-release.browser.js"></script>
</head>

<body>
    <pre id="out">compiling ...</pre>
    <script type="module">
        // The "JavaScript only" versions of the usage examples on crossbind.dev/ports/geotiff/: no C++,
        // only libgeotiff's own headers as crossbind binds them. The demo build opens this page; every
        // example that can work this way must print exactly its `expected`. One that cannot says why
        // instead and has nothing to run.
        import * as locate from './examples/01-locate.js';
        import * as write from './examples/02-write.js';
        import * as keys from './examples/03-keys.js';
        import * as definition from './examples/04-definition.js';
        import * as pixels from './examples/05-pixels.js';

        const EXAMPLES = [locate, write, keys, definition, pixels].filter((example) => example.default);

        const out = document.querySelector('#out');
        const lines = [];
        const show = (text) => {
            lines.push(text);
            out.textContent = lines.join('\n');
        };
        const checks = [];
        const check = (name, actual, expected) => {
            const ok = JSON.stringify(actual) === JSON.stringify(expected);
            checks.push(ok);
            show(`${ok ? 'ok  ' : 'FAIL'} ${name}: ${JSON.stringify(actual)}${ok ? '' : ` (expected ${JSON.stringify(expected)})`}`);
        };

        try {
            // On the page's thread, the way the site boots this module: GTIFImport reads its text
            // through a JavaScript callback, which only a module outside a worker can pass to C.
            const m = await initNative({ path: './dist', useWorker: false });
            for (const example of EXAMPLES) {
                const printed = [];
                await example.default(m, { log: (...values) => printed.push(values.map(String).join(' ')) });
                check(`example "${example.expected[0]}"`, printed, example.expected);
            }
            const passed = checks.filter(Boolean).length;
            // No version: libgeotiff has it only as the LIBGEOTIFF_VERSION macro, and macros are not bound.
            show(`geotiff => ${passed}/${checks.length} checks passed`);
        } catch (error) {
            show(`failed => ${error?.stack ?? error}`);
        }
    </script>
</body>

</html>
