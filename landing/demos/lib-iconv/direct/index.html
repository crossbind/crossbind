<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>crossbind - iconv from JavaScript only</title>
    <script src="./dist/iconvdirect-wasm-wasm32-st-release.browser.js"></script>
</head>

<body>
    <pre id="out">compiling ...</pre>
    <script type="module">
        // The "JavaScript only" versions of the usage examples on crossbind.dev/ports/iconv/: no C++,
        // only libiconv's own iconv.h as crossbind binds it. The demo build opens this page; every example
        // that can work this way must print exactly its `expected`. One that cannot says why instead
        // and has nothing to run.
        import * as convert from './examples/01-convert.js';
        import * as fallbacks from './examples/02-fallbacks.js';
        import * as stream from './examples/03-stream.js';
        import * as encodings from './examples/04-encodings.js';

        const EXAMPLES = [convert, fallbacks, stream, encodings].filter((example) => example.default);

        const out = document.querySelector('#out');
        const lines = [];
        const show = (text) => {
            lines.push(text);
            out.textContent = lines.join('\n');
        };
        const checks = [];
        const check = (name, actual, expected) => {
            const ok = JSON.stringify(actual) === JSON.stringify(expected);
            checks.push(ok);
            show(`${ok ? 'ok  ' : 'FAIL'} ${name}: ${JSON.stringify(actual)}${ok ? '' : ` (expected ${JSON.stringify(expected)})`}`);
        };

        try {
            // On the page's thread, the way the site boots this module: iconvlist takes a JavaScript
            // callback, which only a module outside a worker can pass to C.
            const m = await initNative({ path: './dist', useWorker: false });
            for (const example of EXAMPLES) {
                const printed = [];
                await example.default(m, { log: (...values) => printed.push(values.map(String).join(' ')) });
                check(`example "${example.expected[0]}"`, printed, example.expected);
            }
            const passed = checks.filter(Boolean).length;
            // No version: iconv.h declares it as a variable (_libiconv_version), and variables are not bound.
            show(`iconv => ${passed}/${checks.length} checks passed`);
        } catch (error) {
            show(`failed => ${error?.stack ?? error}`);
        }
    </script>
</body>

</html>
