<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>crossbind - zstd self-check</title>
    <script src="./dist/zstdapps-wasm-wasm32-st-release.browser.js"></script>
</head>

<body>
    <pre id="out">compiling ...</pre>
    <script type="module">
        // Every usage example and every app on crossbind.dev/ports/zstd/ runs on this module. This page
        // is what the demo build opens to prove them: each example must print exactly what its
        // `expected` says, and the apps must give the numbers libzstd 1.5.7 gave CPython on the same
        // generated corpus.
        import * as compress from './examples/01-compress.js';
        import * as stream from './examples/02-stream.js';
        import * as parameters from './examples/03-parameters.js';
        import * as dictionary from './examples/04-dictionary.js';

        const EXAMPLES = [compress, stream, parameters, dictionary];

        const out = document.querySelector('#out');
        const lines = [];
        const show = (text) => {
            lines.push(text);
            out.textContent = lines.join('\n');
        };
        const units = (text) => Uint8Array.from(text, (unit) => unit.charCodeAt(0));
        const hex = async (bytes) => [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))].map((b) => b.toString(16).padStart(2, '0')).join('');

        const checks = [];
        const check = (name, actual, expected) => {
            const ok = expected !== null && JSON.stringify(actual) === JSON.stringify(expected);
            checks.push(ok);
            show(`${ok ? 'ok  ' : 'FAIL'} ${name}: ${JSON.stringify(actual)}${ok ? '' : ` (expected ${JSON.stringify(expected)})`}`);
        };

        try {
            const m = await initNative({ path: './dist' });
            const version = await m.Zstd.version();

            // The usage examples, run exactly as the page shows them.
            for (const example of EXAMPLES) {
                const printed = [];
                await example.default(m, { log: (...values) => printed.push(values.map(String).join(' ')) });
                check(`example "${example.title}"`, printed, example.expected);
            }

            // The generator behind the apps: 2,000 records joined with '\n' (v1 minus its final newline).
            const delta = await new m.DeltaLab();
            const v1 = units(await delta.v1());
            check('corpus sha-256', await hex(v1.subarray(0, v1.length - 1)), 'a4789874b0fb84f31600c6ae2d7ab219567bf4de44a6c7d6a7779ad66e3722ca');

            // Dictionary trainer app.
            const lab = await new m.DictionaryLab(1000);
            const size = await lab.train(4096);
            const plain = JSON.parse(await lab.evaluate(3, false));
            const trimmed = JSON.parse(await lab.evaluate(3, true));
            check('app dictionary', [size, await lab.dictionaryId(), plain.raw, plain.plain, plain.withDictionary, trimmed.withDictionary, plain.roundtrip && trimmed.roundtrip], [4096, 260095074, 534557, 294389, 70823, 65823, true]);

            // Ship-only-the-diff app, as RFC 9842 dcz.
            const sha = await crypto.subtle.digest('SHA-256', v1);
            const dcz = await delta.dcz(String.fromCharCode(...new Uint8Array(sha)), 19, false);
            check('app delta', [await delta.v1Bytes(), (await delta.v2()).length, await delta.aloneBytes(19), await delta.deltaBytes(19, 22, false), dcz.length, await delta.verify(dcz)], [1070945, 1081692, 61541, 982, 1022, true]);
            check('app delta at level 3', [await delta.deltaBytes(3, 22, false), await delta.deltaBytes(3, 22, true)], [3296, 1261]);

            // .tar.zst opener app, streaming from the module's filesystem.
            const path = '/memfs/zstdapps/sample.tar.zst';
            await m.FS.mkdirTree('/memfs/zstdapps');
            await m.ZstOpener.writeSample(path);
            const info = JSON.parse(await m.ZstOpener.frameInfo(path));
            const listing = JSON.parse(await m.ZstOpener.listTar(path));
            const excerpt = await m.ZstOpener.extractText(path, 'b.txt', 14);
            check('app opener', [info.checksum, info.contentSize, listing.format, listing.count, listing.entries.map((entry) => `${entry.name} ${entry.size}`).join(', '), excerpt], [true, 8704, 'tar', 3, 'a.txt 1000, b.txt 2000, c.txt 3000', 'b.txt line 1: ']);

            const passed = checks.filter(Boolean).length;
            show(`zstd ${version} => ${passed}/${checks.length} checks passed`);
        } catch (error) {
            show(`failed => ${error && error.message ? error.message : error}`);
        }
    </script>
</body>

</html>
