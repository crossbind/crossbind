<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>crossbind - zstd from JavaScript only</title>
    <script src="./dist/zstddirect-wasm-wasm32-st-release.browser.js"></script>
</head>

<body>
    <pre id="out">compiling ...</pre>
    <script type="module">
        // The "JavaScript only" versions of the usage examples on crossbind.dev/ports/zstd/: no C++,
        // only zstd's own headers as crossbind binds them. The demo build opens this page; every example
        // that can work this way must print exactly its `expected`. One that cannot says why instead
        // and has nothing to run.
        import * as compress from './examples/01-compress.js';
        import * as stream from './examples/02-stream.js';
        import * as parameters from './examples/03-parameters.js';
        import * as dictionary from './examples/04-dictionary.js';

        const EXAMPLES = [compress, stream, parameters, dictionary].filter((example) => example.default);

        const out = document.querySelector('#out');
        const lines = [];
        const show = (text) => {
            lines.push(text);
            out.textContent = lines.join('\n');
        };
        const checks = [];
        const check = (name, actual, expected) => {
            const ok = JSON.stringify(actual) === JSON.stringify(expected);
            checks.push(ok);
            show(`${ok ? 'ok  ' : 'FAIL'} ${name}: ${JSON.stringify(actual)}${ok ? '' : ` (expected ${JSON.stringify(expected)})`}`);
        };

        try {
            const m = await initNative({ path: './dist' });
            for (const example of EXAMPLES) {
                const printed = [];
                await example.default(m, { log: (...values) => printed.push(values.map(String).join(' ')) });
                check(`example "${example.expected[0]}"`, printed, example.expected);
            }
            const passed = checks.filter(Boolean).length;
            show(`zstd ${await m.ZSTD_versionString()} => ${passed}/${checks.length} checks passed`);
        } catch (error) {
            show(`failed => ${error?.stack ?? error}`);
        }
    </script>
</body>

</html>
