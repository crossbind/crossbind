<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>crossbind - webp self-check</title>
    <script src="./dist/webpapps-wasm-wasm32-st-release.browser.js"></script>
</head>

<body>
    <pre id="out">compiling ...</pre>
    <script type="module">
        // Every usage example and every app on crossbind.dev/ports/webp/ runs on this module. This page
        // is what the demo build opens to prove them: each example must print exactly what its
        // `expected` says, and the apps must give the bytes and numbers cwebp and dwebp 1.6.0, numpy
        // and a native libwebp build gave for the same generated images.
        import * as encodeDecode from './examples/01-encode-decode.js';
        import * as tune from './examples/02-tune.js';
        import * as transparency from './examples/03-transparency.js';
        import * as read from './examples/04-read.js';

        const EXAMPLES = [encodeDecode, tune, transparency, read];

        const out = document.querySelector('#out');
        const lines = [];
        const show = (text) => {
            lines.push(text);
            out.textContent = lines.join('\n');
        };

        const hex = async (bytes) => [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))].map((b) => b.toString(16).padStart(2, '0')).join('');

        const checks = [];
        const check = (name, actual, expected) => {
            const ok = expected !== null && JSON.stringify(actual) === JSON.stringify(expected);
            checks.push(ok);
            show(`${ok ? 'ok  ' : 'FAIL'} ${name}: ${JSON.stringify(actual)}${ok ? '' : ` (expected ${JSON.stringify(expected)})`}`);
        };

        try {
            const m = await initNative({ path: './dist' });
            const version = await m.WebpCodec.version();

            for (const example of EXAMPLES) {
                const printed = [];
                await example.default(m, { log: (...values) => printed.push(values.map(String).join(' ')) });
                check(`example "${example.title}"`, printed, example.expected);
            }

            // WebP Studio: the generated test card, encoded three ways and swept across lossy qualities.
            const dir = '/memfs/webpapps/check';
            await m.FS.mkdirTree(dir);
            await m.WebpStudio.writeTestCard(`${dir}/card.rgba`);
            check('app studio test card sha-256', await hex(await m.getFileBytes(`${dir}/card.rgba`)), '1392c09b27a803bc7b3feeb19b67e818d8ae96783ca938a691d1fab288ab1204');
            const studio = async (mode, quality, near) => JSON.parse(await m.WebpStudio.encode(`${dir}/card.rgba`, 512, 384, `${dir}/${mode}.webp`, mode, quality, near, 'default', 4, false));
            const lossy = await studio('lossy', 75, 100);
            const lossless = await studio('lossless', 75, 100);
            const near = await studio('near-lossless', 75, 60);
            check('app studio', [lossy.bytes, lossy.psnr, lossy.ssim, lossy.identical, lossless.bytes, lossless.psnr, lossless.identical, near.bytes, near.psnr], [14852, 29.37, 0.9561, false, 114478, 99, true, 69312, 47.61]);
            const sweep = JSON.parse(await m.WebpStudio.sweep(`${dir}/card.rgba`, 512, 384, 'default', 4, false));
            check('app studio sweep', [sweep.map((point) => point.bytes), sweep[0].psnr, sweep[10].psnr], [[3980, 6610, 7828, 9264, 10600, 11782, 12860, 14042, 17148, 26636, 54280], 24.35, 30.02]);

            // Sticker maker: the smiley sample under WhatsApp's 100 KB and under a 12 KB budget.
            await m.StickerMaker.writeSample(`${dir}/smiley.rgba`);
            const sticker = async (budget) => JSON.parse(await m.StickerMaker.make(`${dir}/smiley.rgba`, 600, 400, true, budget, `${dir}/sticker.webp`, `${dir}/sticker.rgba`));
            const roomy = await sticker(100000);
            const tight = await sticker(12000);
            check('app sticker', [roomy.contentWidth, roomy.contentHeight, roomy.bytes, roomy.quality, roomy.fits, tight.bytes, tight.quality, tight.fits], [496, 496, 33610, 100, true, 11952, 12, true]);

            // Streaming decode of the studio's lossy card: rows available after a quarter, half and three quarters of the bytes.
            const total = (await m.getFileBytes(`${dir}/lossy.webp`)).length;
            const prefix = async (available) => JSON.parse(await m.WebpStream.decodePrefix(`${dir}/lossy.webp`, available, `${dir}/frame.rgba`));
            const header = await prefix(30);
            const rows = [];
            for (const share of [1, 2, 3]) rows.push((await prefix(Math.floor((total * share) / 4))).rows);
            const done = await prefix(total);
            check('app stream', [header.width, header.height, header.rows, rows, done.rows, done.complete], [512, 384, 0, [55, 135, 247], 384, true]);

            const passed = checks.filter(Boolean).length;
            show(`webp ${version} => ${passed}/${checks.length} checks passed`);
        } catch (error) {
            show(`failed => ${error && error.message ? error.message : error}`);
        }
    </script>
</body>

</html>
