<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>crossbind - playground sample</title>
</head>

<body>
    <pre id="out"></pre>
    <script type="module">
        // The tutorial and the playground run this module for an unedited sample; this page is what the demo build
        // opens to prove it runs the sample's main.js the way they do, through the playground's own sandbox and the
        // runner the build copies beside it.
        import { runInSandbox } from './sandbox.js';

        const out = document.querySelector('#out');
        const print = (text) => {
            out.textContent += `${text}\n`;
        };
        const fetchOk = async (url) => {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`${url} answered ${response.status}`);
            return response;
        };
        const toBase64 = (bytes) => {
            let binary = '';
            for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
            return btoa(binary);
        };

        try {
            const [js, wasm, imports, code, scripts] = await Promise.all([
                fetchOk('./dist/sample.js').then((response) => response.text()),
                fetchOk('./dist/sample.wasm').then((response) => response.arrayBuffer()),
                fetchOk('./dist/imports.json').then((response) => response.json()),
                fetchOk('./main.js').then((response) => response.text()),
                fetchOk('./scripts.json').then((response) => response.json()),
            ]);
            const { done } = runInSandbox({ js, wasm: toBase64(new Uint8Array(wasm)), imports, code, scripts, onOutput: ({ text }) => print(text) });
            const outcome = await done;
            print(outcome === 'done' ? '=> done' : `failed => ${outcome}`);
        } catch (error) {
            print(`failed => ${error.message}`);
        }
    </script>
</body>

</html>
