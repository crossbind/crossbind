name: check tree
on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read
concurrency:
    # A newer push to the same pull request or branch supersedes the running checks.
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
jobs:
    # The gates of `pnpm run check` that read nothing but the tree. No path filter: they read core/,
    # plugins/ and every port's recipe.
    gates:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Lint
              run: pnpm run lint
            - name: Every declared port dependency is wired into its build
              run: pnpm run check:wiring:strict
            - name: Every downloaded source pins its sha256
              run: pnpm run check:sources:strict
            - name: The CI scripts pass their checks
              run: pnpm run check:ci
