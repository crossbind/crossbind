name: check tree
on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read
jobs:
    # The gates of `pnpm run check` that read nothing but the tree. No path filter: they read core/,
    # plugins/ and every port's recipe.
    gates:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Lint
              run: pnpm run lint
            - name: Every declared port dependency is wired into its build
              run: pnpm run check:wiring:strict
            - name: Every downloaded source pins its sha256
              run: pnpm run check:sources:strict
