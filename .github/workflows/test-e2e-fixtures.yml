name: test e2e fixtures
on:
    workflow_dispatch:
    schedule:
        # The full port matrix is shared once a week; the smaller PR jobs stay fast.
        - cron: '30 3 * * 0'

permissions: {}
env:
    CROSSBIND_RUNNER: DOCKER_RUN

jobs:
    wasm-ports:
        runs-on: ubuntu-latest
        timeout-minutes: 180
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Build the fixtures' Wasm dependencies
              run: |
                  pnpm --filter='@crossbind/port-*-wasm' run build
                  pnpm --filter=@crossbind/example-lib-prebuilt-matrix run build:wasm
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: e2e-wasm-ports
                  if-no-files-found: error
                  retention-days: 1
                  path: |
                      ports/*/wasm/dist/
                      examples/lib-prebuilt-matrix/dist/

    fixtures:
        needs: wasm-ports
        runs-on: ubuntu-latest
        timeout-minutes: 90
        strategy:
            fail-fast: false
            max-parallel: 3
            matrix:
                fixture:
                    - backend-nodejs
                    - backend-nodejs-multithread
                    - backend-nodejs-import-hooks
                    - cli-wasi
                    - cloud-wasi-http
                    - cloud-cloudflare-worker
                    - web-vanilla
                    - web-vite
                    - web-vite-multithread
                    - web-rspack
                    - web-vite-conan
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: e2e-wasm-ports
                  path: .
            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps
            - name: Install the WASI runtime
              if: matrix.fixture == 'cli-wasi' || matrix.fixture == 'cloud-wasi-http'
              run: |
                  curl -sSfL https://github.com/bytecodealliance/wasmtime/releases/download/v47.0.2/wasmtime-v47.0.2-x86_64-linux.tar.xz -o "$RUNNER_TEMP/wasmtime.tar.xz"
                  echo "9ec85751649139711b6a5061c4f48a41412bf9b1ab98a08b9924ca73f22ca575  $RUNNER_TEMP/wasmtime.tar.xz" | sha256sum -c -
                  tar -xJf "$RUNNER_TEMP/wasmtime.tar.xz" -C "$RUNNER_TEMP"
                  echo "$RUNNER_TEMP/wasmtime-v47.0.2-x86_64-linux" >> "$GITHUB_PATH"
            - name: Install Spin
              if: matrix.fixture == 'cloud-wasi-http'
              run: |
                  curl -sSfL https://github.com/spinframework/spin/releases/download/v4.2.2/spin-v4.2.2-linux-amd64.tar.gz -o "$RUNNER_TEMP/spin.tar.gz"
                  echo "e2c8b2b9893119ce1b8fc1db22ed27d6c3f1ef23ec8880848d14a4f85fd2a685  $RUNNER_TEMP/spin.tar.gz" | sha256sum -c -
                  mkdir "$RUNNER_TEMP/spin"
                  tar -xzf "$RUNNER_TEMP/spin.tar.gz" -C "$RUNNER_TEMP/spin"
                  echo "$RUNNER_TEMP/spin" >> "$GITHUB_PATH"
            - name: Build the fixture
              run: pnpm --filter=@crossbind/e2e-${{ matrix.fixture }} run build
            - name: Run production conformance
              if: matrix.fixture != 'cloud-cloudflare-worker'
              run: pnpm --filter=@crossbind/e2e-${{ matrix.fixture }} run e2e:prod
            - name: Run the edge runtime conformance
              if: matrix.fixture == 'cloud-cloudflare-worker'
              run: pnpm --filter=@crossbind/e2e-cloud-cloudflare-worker run e2e:dev

    react-native:
        runs-on: ubuntu-latest
        timeout-minutes: 180
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
              with:
                  distribution: temurin
                  java-version: '17'
            - run: pnpm install --frozen-lockfile
            - name: Build the React Native fixtures' dependencies
              run: |
                  pnpm --filter='@crossbind/port-*-android' run build
                  pnpm --filter=@crossbind/example-lib-prebuilt-matrix run build:android
                  pnpm --filter=@crossbind/embind-rust-demo --filter=@crossbind/conformance-rust run build:android
            - name: Install Maestro
              run: |
                  curl -fsSL 'https://get.maestro.mobile.dev' | bash
                  echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
            - name: Run the React Native conformance fixture
              uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              with:
                  api-level: 36
                  target: default
                  arch: x86_64
                  cmake: 4.1.2
                  ndk: 30.0.16248370
                  emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                  disable-animations: true
                  script: pnpm --filter=@crossbind/e2e-mobile-reactnative-cli run e2e:android
