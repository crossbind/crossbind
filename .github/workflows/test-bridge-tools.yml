name: test bridge-tools
on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - tooling/bridge-tools/**
            - tooling/docker/base.Dockerfile
            - core/crossbind/src/assets/toolchain-digests.json
            - core/crossbind/src/utils/headerImports.js
            - core/crossbind/src/utils/licenseReport.js
            - core/crossbind/src/utils/swigInterface.js
            - e2e/conformance/**
            - .nvmrc
            - .github/workflows/test-bridge-tools.yml
            - '!**/*.md'
    pull_request:
        branches:
            - main
        paths:
            - tooling/bridge-tools/**
            - tooling/docker/base.Dockerfile
            - core/crossbind/src/assets/toolchain-digests.json
            - core/crossbind/src/utils/headerImports.js
            - core/crossbind/src/utils/licenseReport.js
            - core/crossbind/src/utils/swigInterface.js
            - e2e/conformance/**
            - .nvmrc
            - .github/workflows/test-bridge-tools.yml
            - '!**/*.md'

permissions: {}
concurrency:
    # A newer push to the same pull request or branch supersedes the running checks.
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
jobs:
    tested:
        uses: ./.github/workflows/tested-tree.yml
        permissions:
            actions: read
            contents: read
            pull-requests: read
        with:
            workflow: test-bridge-tools.yml
    # The web image builds the package, and makes the macro tables and bridges a Mac must make with it.
    build:
        needs: tested
        if: needs.tested.outputs.tested != 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Unit tests
              run: node --test tooling/bridge-tools/test/build.test.mjs
            - name: Build the package in the web image
              run: node tooling/bridge-tools/scripts/build.mjs
            - name: Make the web image's macro tables and bridges
              run: node tooling/bridge-tools/scripts/reference.mjs
            - name: Upload the package and the references
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: bridge-tools
                  if-no-files-found: error
                  # A re-run of this job uploads under the same name again.
                  overwrite: true
                  include-hidden-files: true
                  path: |
                      tooling/bridge-tools/dist/
                      tooling/bridge-tools/.parity/
    parity:
        needs: build
        runs-on: macos-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
            - name: Download the package and the references
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: bridge-tools
                  path: tooling/bridge-tools
            - name: SWIG runner tests
              run: node --test tooling/bridge-tools/test/swig.test.mjs
            - name: Check the package against the web image
              run: node tooling/bridge-tools/scripts/parity.mjs
            - name: Upload what the two made
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: bridge-tools-parity
                  overwrite: true
                  include-hidden-files: true
                  path: tooling/bridge-tools/.parity/
