name: test node addon conformance
# Scratch of test/app-host/windows-project-origin-spike, which is never a pull request: the review's Windows
# checks of feat/app-host/an-extension-serves-an-origin on Windows x64, each run with one fix undone, which must fail.
on:
    workflow_dispatch:

permissions: {}
jobs:
    app-windows:
        # A hosted Windows runner cannot run crossbind's windows image, a Linux one, so this runner builds the app in it,
        # against the Hermes and the WebView2 SDK headers the image carries.
        runs-on: ubuntu-latest
        # main's pushes alone reach the ci-cache environment, whose secrets write the compiler cache; it records no deployment.
        environment:
            name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ci-cache' || '' }}
            deployment: false
        timeout-minutes: 60
        env:
            CROSSBIND_APP_PLATFORM: windows
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Set up the compiler cache
              uses: ./.github/actions/setup-sccache
              with:
                  read-key-id: ${{ secrets.SCCACHE_R2_READ_KEY_ID }}
                  read-secret: ${{ secrets.SCCACHE_R2_READ_SECRET }}
                  write-key-id: ${{ secrets.SCCACHE_R2_WRITE_KEY_ID }}
                  write-secret: ${{ secrets.SCCACHE_R2_WRITE_SECRET }}
                  endpoint: ${{ vars.SCCACHE_R2_ENDPOINT }}
            - name: Make a throwaway key, with which the build signs the app and its setup program
              run: >-
                  keytool -genkeypair -alias "crossbind e2e" -keyalg RSA -keysize 2048 -validity 2 -dname "CN=crossbind e2e"
                  -ext EKU=codeSigning -keystore "$RUNNER_TEMP/e2e.p12" -storetype PKCS12 -storepass e2e-pass
            - name: Build the app
              env:
                  CROSSBIND_WINDOWS_SIGNING_STORETYPE: PKCS12
                  CROSSBIND_WINDOWS_SIGNING_KEYSTORE: ${{ runner.temp }}/e2e.p12
                  CROSSBIND_WINDOWS_SIGNING_ALIAS: crossbind e2e
                  CROSSBIND_WINDOWS_SIGNING_STOREPASS: e2e-pass
              run: pnpm --filter=@crossbind/e2e-desktop-app run build
            # The app's own page-dialogs and page-permissions take the place of the host's, which this app keeps.
            - name: Build e2e/app-page-requests
              run: pnpm --filter=@crossbind/e2e-app-page-requests run build
            - name: Build an app with none of crossbind's own extensions
              run: pnpm --filter=@crossbind/e2e-app-bare run build
            - name: Check that the app loads the system DLLs it imports from System32 alone
              # A file of their name in the app's folder, as in one it was downloaded to, would otherwise run inside it.
              run: |
                  image="ghcr.io/crossbind/windows@$(node -p "require('./core/crossbind/src/assets/toolchain-digests.json').images.windows.index")"
                  for exe in e2e/desktop-app/dist/crossbind-e2e-desktop-app-win32-*/crossbind-e2e-desktop-app.exe; do
                      docker run --rm --entrypoint /opt/llvm-mingw/bin/llvm-readobj -v "$PWD:/w" -w /w "$image" --coff-load-config "$exe" \
                          | grep -q 'DependentLoadFlags: 0x800' || { echo "$exe looks for its DLLs in its own folder first"; exit 1; }
                  done
            - name: Keep the app for the runners that open it
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: windows-app
                  if-no-files-found: error
                  # A re-run of this job uploads under the same name again.
                  overwrite: true
                  path: |
                      e2e/desktop-app/dist/crossbind-e2e-desktop-app-win32-x64/
                      e2e/desktop-app/dist/crossbind-e2e-desktop-app-win32-arm64/
                      e2e/desktop-app/dist/crossbind-e2e-desktop-app-win32-*-setup.exe
                      e2e/desktop-app/dist/crossbind-e2e-desktop-app-win32-*.msix
                      e2e/desktop-app/dist/crossbind-e2e-desktop-app-win32-*.probe.json
                  retention-days: 1
            - name: Keep e2e/app-page-requests for the runners that open it
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: windows-page-requests
                  if-no-files-found: error
                  overwrite: true
                  path: |
                      e2e/app-page-requests/dist/crossbind-e2e-app-page-requests-win32-x64/
                      e2e/app-page-requests/dist/crossbind-e2e-app-page-requests-win32-arm64/
                  retention-days: 1
    app-windows-run:
        # Each Windows runner opens the app built for it, on its own WebView2 Runtime. The checkout's directory has a
        # non-ASCII name, as a user's folder may: the app finds its files by a UTF-8 path.
        needs: app-windows
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { runner: windows-latest, arch: x64 }
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 15
        env:
            # The common name of the signer the updater holds an update to, once the runner trusts the build's key:
            # e2e/run.mjs checks the app named it.
            CROSSBIND_E2E_UPDATE_SIGNER: crossbind e2e
        defaults:
            run:
                working-directory: ünicode
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  path: ünicode
            - name: Install pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
              with:
                  package_json_file: ünicode/package.json
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: ünicode/.nvmrc
                  # The runner opens the app of Node's arch: an emulated x64 Node.js would open the x64 app on the
                  # arm64 runner.
                  architecture: ${{ matrix.arch }}
            - name: Install the conformance kit
              # The leg's config imports the kit; nothing is built on these runners.
              run: pnpm install --frozen-lockfile --prod --filter "@crossbind/e2e-desktop-app..."
            - name: Restore the app
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: windows-app
                  path: ünicode/e2e/desktop-app/dist
            - name: Trust the key the build signed with, so that the app's updater holds an update to the app's signer
              run: |
                  $certificate = (Get-AuthenticodeSignature e2e\desktop-app\dist\crossbind-e2e-desktop-app-win32-${{ matrix.arch }}\crossbind-e2e-desktop-app.exe).SignerCertificate
                  if (-not $certificate) { throw 'the app carries no signature' }
                  $store = [System.Security.Cryptography.X509Certificates.X509Store]::new('Root', 'LocalMachine')
                  $store.Open('ReadWrite')
                  $store.Add($certificate)
                  $store.Close()
            - name: Leave a WebView2 profile where a release before kept it, under the executable's name in the roaming folder
              run: New-Item -ItemType File -Force -Path "$env:APPDATA\crossbind-e2e-desktop-app.exe\crossbind-profile" | Out-Null
            - name: Run the conformance suite in the app
              run: node e2e/desktop-app/e2e/run.mjs
            - name: Restore e2e/app-page-requests
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: windows-page-requests
                  path: ünicode/e2e/app-page-requests/dist
            - name: Answer the host's own page dialogs as the app's user would
              run: node e2e/app-page-requests/e2e/run.mjs
            - name: Check that the profile moved to the app's own local folder
              run: |
                  if (-not (Test-Path "$env:LOCALAPPDATA\dev.crossbind.crossbind-e2e-desktop-app\WebView2\crossbind-profile")) { throw 'the profile of a release before did not move' }
                  if (Test-Path "$env:APPDATA\crossbind-e2e-desktop-app.exe") { throw 'the profile of a release before stayed in the roaming folder' }
            - name: Check what the setup program asks of the WebView2 bootstrapper before running it
              # The command installer.nsi runs, with the system's own PowerShell, which its 32-bit setup program finds
              # through Sysnative and this step in System32: Microsoft's bootstrapper passes, a file another signed or
              # none signed fails.
              run: |
                  $line = Select-String -Path extensions\nsis\installer.nsi -Pattern 'nsExec::ExecToStack (?:/TIMEOUT=\d+ )?`"([^"]+)" (.*)`'
                  if (-not $line) { throw 'installer.nsi runs no check of the bootstrapper' }
                  $program = $line.Matches[0].Groups[1].Value.Replace('$WINDIR\Sysnative', "$env:SystemRoot\System32")
                  $arguments = $line.Matches[0].Groups[2].Value.Replace('$$', '$')
                  $bootstrapper = "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe"
                  Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper -MaximumRetryCount 3 -RetryIntervalSec 5
                  Set-Content -Path "$env:RUNNER_TEMP\unsigned.exe" -Value 'not a program'
                  $expected = @{ $bootstrapper = 0; "$env:RUNNER_TEMP\unsigned.exe" = 1; "$PWD\e2e\desktop-app\dist\crossbind-e2e-desktop-app-win32-${{ matrix.arch }}\crossbind-e2e-desktop-app.exe" = 1 }
                  foreach ($file in $expected.Keys) {
                      $env:CROSSBIND_WEBVIEW2_BOOTSTRAPPER = $file
                      $check = Start-Process -FilePath $program -ArgumentList $arguments -NoNewWindow -Wait -PassThru
                      if ($check.ExitCode -ne $expected[$file]) { throw "the check answered $($check.ExitCode) for $file, not $($expected[$file])" }
                  }
            - name: Install the app with its setup program, whose Settings entry names package.json's author as the publisher
              run: |
                  $setup = Start-Process -Wait -PassThru -FilePath e2e\desktop-app\dist\crossbind-e2e-desktop-app-win32-${{ matrix.arch }}-setup.exe -ArgumentList /S
                  if ($setup.ExitCode -ne 0) { throw "the setup program exited with $($setup.ExitCode)" }
                  $entry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\dev.crossbind.crossbind-e2e-desktop-app'
                  $publisher = (Get-ItemProperty -LiteralPath $entry).Publisher
                  if ($publisher -ne 'crossbind e2e') { throw "the Settings entry names '$publisher' as the publisher, not package.json's author by name" }
            - name: Check that the app, its setup program and its uninstaller carry the build's signature
              run: |
                  $files = "e2e\desktop-app\dist\crossbind-e2e-desktop-app-win32-${{ matrix.arch }}\crossbind-e2e-desktop-app.exe",
                      "e2e\desktop-app\dist\crossbind-e2e-desktop-app-win32-${{ matrix.arch }}-setup.exe",
                      "$env:LOCALAPPDATA\Programs\crossbind-e2e-desktop-app\uninstall.exe"
                  foreach ($file in $files) {
                      # The runner trusts the throwaway key, so a sound signature by it is valid, as the updater asks.
                      $signature = Get-AuthenticodeSignature $file
                      if ($signature.Status -ne 'Valid') { throw "$file has no valid signature: $($signature.Status)" }
                      if ($signature.SignerCertificate.Subject -ne 'CN=crossbind e2e') { throw "$file is not signed by the build's key: $($signature.SignerCertificate.Subject)" }
                      if (-not $signature.TimeStamperCertificate) { throw "$file has no timestamp" }
                  }
            - name: Run the conformance suite in the installed app
              run: node e2e/desktop-app/e2e/run.mjs --installed
            - name: Update the installed app as its updater does, which waits for the app to quit, opens it again and removes the URL schemes it no longer lists
              run: |
                  $app = "$env:LOCALAPPDATA\Programs\crossbind-e2e-desktop-app"
                  $exe = "$app\crossbind-e2e-desktop-app.exe"
                  # A scheme a release before registered and this one no longer lists, and another app's.
                  $dropped = 'HKCU:\Software\Classes\crossbind-e2e-dropped'
                  $foreign = 'HKCU:\Software\Classes\crossbind-e2e-foreign'
                  foreach ($scheme in $dropped, $foreign) {
                      New-Item -Path "$scheme\shell\open\command" -Force | Out-Null
                      Set-ItemProperty -LiteralPath $scheme -Name 'URL Protocol' -Value ''
                  }
                  Set-Item -LiteralPath "$dropped\shell\open\command" -Value "`"$exe`" `"%1`""
                  Set-Item -LiteralPath "$foreign\shell\open\command" -Value '"C:\elsewhere\app.exe" "%1"'
                  $running = Start-Process -PassThru -FilePath $exe
                  $setup = Start-Process -PassThru -FilePath e2e\desktop-app\dist\crossbind-e2e-desktop-app-win32-${{ matrix.arch }}-setup.exe -ArgumentList "/S /UPDATE /D=$app"
                  # PowerShell reads a process's exit code through a handle it took while the process ran.
                  $null = $setup.Handle
                  Start-Sleep -Seconds 3
                  if ($setup.HasExited) { throw "the update did not wait for the app to quit" }
                  Stop-Process -Id $running.Id -Force
                  if (-not $setup.WaitForExit(60000)) { throw 'the update did not finish once the app had quit' }
                  if ($setup.ExitCode -ne 0) { throw "the update exited with $($setup.ExitCode)" }
                  if (Test-Path $dropped) { throw "the update left $dropped, which the app no longer lists" }
                  foreach ($path in $foreign, 'HKCU:\Software\Classes\crossbind-e2e') { if (-not (Test-Path $path)) { throw "the update removed $path" } }
                  $opened = $null
                  for ($i = 0; $i -lt 30 -and -not $opened; $i++) {
                      Start-Sleep -Seconds 1
                      $opened = Get-Process -Name crossbind-e2e-desktop-app -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe -and $_.Id -ne $running.Id }
                  }
                  if (-not $opened) { throw 'the update did not open the app again' }
                  # The uninstaller stops while the app runs.
                  $opened | Stop-Process -Force
                  $opened | Wait-Process -Timeout 30
            - name: Uninstall the app, which takes its shortcut, its files, its entry in Settings and its URL schemes
              run: |
                  $app = "$env:LOCALAPPDATA\Programs\crossbind-e2e-desktop-app"
                  $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\crossbind-e2e-desktop-app.lnk"
                  $entry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\dev.crossbind.crossbind-e2e-desktop-app'
                  $scheme = 'HKCU:\Software\Classes\crossbind-e2e'
                  # The probe extension's scheme, which the setup program registers beside the app's.
                  $probe = 'HKCU:\Software\Classes\crossbind-probe'
                  # A scheme of the app it no longer lists, as an uninstaller before this one left behind.
                  $dropped = 'HKCU:\Software\Classes\crossbind-e2e-dropped'
                  $foreign = 'HKCU:\Software\Classes\crossbind-e2e-foreign'
                  New-Item -Path "$dropped\shell\open\command" -Force | Out-Null
                  Set-ItemProperty -LiteralPath $dropped -Name 'URL Protocol' -Value ''
                  Set-Item -LiteralPath "$dropped\shell\open\command" -Value "`"$app\crossbind-e2e-desktop-app.exe`" `"%1`""
                  foreach ($path in $shortcut, $entry, $scheme, $probe) { if (-not (Test-Path $path)) { throw "the setup program left out $path" } }
                  # A link of app.urlSchemes opens the app with the link as its argument, as the suite launches it.
                  $command = (Get-Item -LiteralPath "$scheme\shell\open\command").GetValue('')
                  if ($command -ne "`"$app\crossbind-e2e-desktop-app.exe`" `"%1`"") { throw "a link of the scheme runs $command" }
                  $uninstall = Start-Process -Wait -PassThru -FilePath "$app\uninstall.exe" -ArgumentList /S
                  if ($uninstall.ExitCode -ne 0) { throw "the uninstaller exited with $($uninstall.ExitCode)" }
                  # It finishes from a copy of itself, whose last step removes the folder.
                  for ($i = 0; $i -lt 30 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
                  foreach ($path in $app, $shortcut, $entry, $scheme, $probe, $dropped) { if (Test-Path $path) { throw "the uninstaller left $path" } }
                  if (-not (Test-Path $foreign)) { throw "the uninstaller removed $foreign, another app's" }
                  Remove-Item -LiteralPath $foreign -Recurse
