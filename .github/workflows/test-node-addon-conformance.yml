name: test node addon conformance
# Scratch of test/app-host/windows-project-origin-spike, which is never a pull request: WebKitGTK's storage features on
# the runner's WebKitGTK, which the app lists and with CROSSBIND_SCRATCH_OPFS=1 turns on, for the app's own page's OPFS.
on:
    workflow_dispatch:

permissions: {}
jobs:
    app-linux:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Set up the compiler cache
              uses: ./.github/actions/setup-sccache
              with:
                  read-key-id: ${{ secrets.SCCACHE_R2_READ_KEY_ID }}
                  read-secret: ${{ secrets.SCCACHE_R2_READ_SECRET }}
                  write-key-id: ${{ secrets.SCCACHE_R2_WRITE_KEY_ID }}
                  write-secret: ${{ secrets.SCCACHE_R2_WRITE_SECRET }}
                  endpoint: ${{ vars.SCCACHE_R2_ENDPOINT }}
            - name: Build the app
              run: pnpm --filter=@crossbind/e2e-desktop-app run build
            - name: Install the app's Debian package, whose dependencies bring the WebKitGTK it runs on
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends ./e2e/desktop-app/dist/crossbind-e2e-desktop-app-linux-x64.deb dbus python3-gi xdotool x11-utils
                  dpkg -s libwebkit2gtk-4.1-0 | grep -E '^(Package|Version)'
            - name: Run as it is, and with the storage features on
              env:
                  WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
                  WEBKIT_DISABLE_COMPOSITING_MODE: '1'
              run: |
                  xvfb-run -a pnpm --filter=@crossbind/e2e-desktop-app run e2e:prod > plain.log 2>&1 || true
                  echo '== as it is'; cat /tmp/crossbind-scratch-features.txt || true; rm -f /tmp/crossbind-scratch-features.txt
                  CROSSBIND_SCRATCH_OPFS=1 xvfb-run -a pnpm --filter=@crossbind/e2e-desktop-app run e2e:prod > features.log 2>&1 || true
                  echo '== with the features on'; cat /tmp/crossbind-scratch-features.txt || true
                  for log in plain.log features.log; do echo "== $log"; grep -E 'SCRATCH webkitgtk|PAGE GETS (opfs|worker-|page )|CONFORMANCE' "$log" | cut -c1-400; done
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              if: always()
              with:
                  name: linux-features
                  path: '*.log'
