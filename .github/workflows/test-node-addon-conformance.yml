name: test node addon conformance
on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - core/crossbind/**
            - core/embind-jsi/**
            - core/embind-napi/**
            - core/embind-rust/**
            - core/app-host/**
            - plugins/vite/**
            - plugins/rollup/**
            - e2e/backend-nodejs-native/**
            - e2e/desktop-app/**
            - e2e/conformance/**
            - e2e/conformance-rust/**
            - .nvmrc
            - .github/workflows/test-node-addon-conformance.yml
    pull_request:
        branches:
            - main
        paths:
            - core/crossbind/**
            - core/embind-jsi/**
            - core/embind-napi/**
            - core/embind-rust/**
            - core/app-host/**
            - plugins/vite/**
            - plugins/rollup/**
            - e2e/backend-nodejs-native/**
            - e2e/desktop-app/**
            - e2e/conformance/**
            - e2e/conformance-rust/**
            - .nvmrc
            - .github/workflows/test-node-addon-conformance.yml

permissions: {}
concurrency:
    # A new push to a pull request supersedes its running checks; a main commit keeps its own run.
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true
jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Build the Linux and Windows addons
              # C++ and Rust alike: the kit's Rust packages and the crates the suite imports build in the
              # linux and windows images too.
              run: pnpm run ci:linux:build:conformance
            - name: Keep the addons for the runners that load them
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: node-addon-conformance
                  if-no-files-found: error
                  # A re-run of this job uploads under the same name again.
                  overwrite: true
                  # The suite checks that every kit export it reaches was bound, from the build's bridge exports;
                  # the app leg builds from the bridges and interfaces themselves.
                  include-hidden-files: true
                  # dist/node holds the addon's entry and the import hooks the suite runs under.
                  path: |
                      e2e/backend-nodejs-native/dist/*.node
                      e2e/backend-nodejs-native/dist/*.cjs
                      e2e/backend-nodejs-native/dist/node/
                      e2e/backend-nodejs-native/.crossbind/cache.json
                      e2e/backend-nodejs-native/.crossbind/build/bridge/
                      e2e/backend-nodejs-native/.crossbind/build/interface/
                  retention-days: 1
    run:
        # Linux runs the glibc and musl addons in containers; a hosted Windows runner cannot run the
        # Linux images, so each Windows runner loads the addon built for it.
        needs: build
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { runner: ubuntu-latest, arch: x64 }
                    - { runner: windows-latest, arch: x64 }
                    - { runner: windows-11-arm, arch: arm64 }
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  # An emulated x64 Node.js would load the x64 addon on the arm64 runner.
                  architecture: ${{ matrix.arch }}
            - name: Install the conformance kit
              # The suite imports the kit; nothing is built on these runners.
              run: pnpm install --frozen-lockfile --prod --filter "@crossbind/e2e-backend-nodejs-native..."
            - name: Restore the addons
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: node-addon-conformance
                  path: e2e/backend-nodejs-native
            - name: Run the conformance suite
              run: node e2e/backend-nodejs-native/e2e/run.mjs
    app:
        # A macOS runner has no Docker to run SWIG in, so the app leg builds from the addon's bridges: it binds
        # the same headers with the same names.
        needs: build
        runs-on: macos-latest
        timeout-minutes: 60
        env:
            # The leg's crate imports are resolved with cargo metadata, which runs in the image unless the runner
            # is LOCAL.
            CROSSBIND_RUNNER: LOCAL
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Restore the addon build
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: node-addon-conformance
                  path: e2e/backend-nodejs-native
            - name: Take its bridges under the app leg's paths
              working-directory: e2e/desktop-app
              run: |
                  mkdir -p .crossbind/build
                  cp -r ../backend-nodejs-native/.crossbind/build/bridge ../backend-nodejs-native/.crossbind/build/interface .crossbind/build/
                  cp ../backend-nodejs-native/.crossbind/cache.json .crossbind/
                  sed -i '' -e 's#/home/runner/work/#/Users/runner/work/#g' -e 's#/e2e/backend-nodejs-native/#/e2e/desktop-app/#g' \
                      .crossbind/cache.json .crossbind/build/bridge/*.source .crossbind/build/bridge/*.deps
            - name: Build the app and run the conformance suite in it
              run: |
                  pnpm --filter=@crossbind/e2e-desktop-app run build
                  pnpm --filter=@crossbind/e2e-desktop-app run e2e:prod
            - name: Run the conformance suite in the app as its disk image holds it
              run: node e2e/desktop-app/e2e/run.mjs --installed
    app-ios:
        # The iOS app builds on a macOS runner from the addon's bridges as the macOS app does, its Rust for both
        # iOS SDKs, and runs in the Simulator.
        needs: build
        runs-on: macos-latest
        timeout-minutes: 60
        env:
            CROSSBIND_RUNNER: LOCAL
            CROSSBIND_APP_PLATFORM: ios
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Add Rust's iOS targets
              run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
            - name: Restore the addon build
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: node-addon-conformance
                  path: e2e/backend-nodejs-native
            - name: Take its bridges under the app leg's paths
              working-directory: e2e/desktop-app
              run: |
                  mkdir -p .crossbind/build
                  cp -r ../backend-nodejs-native/.crossbind/build/bridge ../backend-nodejs-native/.crossbind/build/interface .crossbind/build/
                  cp ../backend-nodejs-native/.crossbind/cache.json .crossbind/
                  sed -i '' -e 's#/home/runner/work/#/Users/runner/work/#g' -e 's#/e2e/backend-nodejs-native/#/e2e/desktop-app/#g' \
                      .crossbind/cache.json .crossbind/build/bridge/*.source .crossbind/build/bridge/*.deps
            - name: Build the app and run the conformance suite in the Simulator
              run: |
                  pnpm --filter=@crossbind/e2e-desktop-app run build
                  pnpm --filter=@crossbind/e2e-desktop-app run e2e:prod
    app-linux:
        # The app builds in crossbind's linux image, as the addons do, against the Hermes and the WebKitGTK headers and
        # libraries the image carries, and runs on the runner's own WebKitGTK.
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Build the app
              run: pnpm --filter=@crossbind/e2e-desktop-app run build
            - name: Install the app's Debian package, whose dependencies bring the WebKitGTK it runs on
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends ./e2e/desktop-app/dist/crossbind-e2e-desktop-app-linux-x64.deb
            - name: Run the conformance suite in the app and in the installed app
              # WebKitGTK runs without its sandbox and GPU compositing, as in the containers the app was measured in.
              env:
                  WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
                  WEBKIT_DISABLE_COMPOSITING_MODE: '1'
              run: |
                  xvfb-run -a pnpm --filter=@crossbind/e2e-desktop-app run e2e:prod
                  xvfb-run -a node e2e/desktop-app/e2e/run.mjs --installed
    app-windows:
        # A hosted Windows runner cannot run crossbind's windows image, a Linux one, so this runner builds the app in it,
        # against the Hermes and the WebView2 SDK headers the image carries.
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            CROSSBIND_APP_PLATFORM: windows
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Make a throwaway key, with which the build signs the app and its setup program
              run: >-
                  keytool -genkeypair -alias "crossbind e2e" -keyalg RSA -keysize 2048 -validity 2 -dname "CN=crossbind e2e"
                  -ext EKU=codeSigning -keystore "$RUNNER_TEMP/e2e.p12" -storetype PKCS12 -storepass e2e-pass
            - name: Build the app
              env:
                  CROSSBIND_WINDOWS_SIGNING_STORETYPE: PKCS12
                  CROSSBIND_WINDOWS_SIGNING_KEYSTORE: ${{ runner.temp }}/e2e.p12
                  CROSSBIND_WINDOWS_SIGNING_ALIAS: crossbind e2e
                  CROSSBIND_WINDOWS_SIGNING_STOREPASS: e2e-pass
              run: pnpm --filter=@crossbind/e2e-desktop-app run build
            - name: Keep the app for the runners that open it
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: windows-app
                  if-no-files-found: error
                  # A re-run of this job uploads under the same name again.
                  overwrite: true
                  path: |
                      e2e/desktop-app/dist/crossbind-e2e-desktop-app-win32-x64/
                      e2e/desktop-app/dist/crossbind-e2e-desktop-app-win32-arm64/
                      e2e/desktop-app/dist/crossbind-e2e-desktop-app-win32-*-setup.exe
                  retention-days: 1
    app-windows-run:
        # Each Windows runner opens the app built for it, on its own WebView2 Runtime. The checkout's directory has a
        # non-ASCII name, as a user's folder may: the app finds its files by a UTF-8 path.
        needs: app-windows
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { runner: windows-latest, arch: x64 }
                    - { runner: windows-11-arm, arch: arm64 }
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 15
        defaults:
            run:
                working-directory: ünicode
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  path: ünicode
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  package_json_file: ünicode/package.json
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: ünicode/.nvmrc
                  # The runner opens the app of Node's arch: an emulated x64 Node.js would open the x64 app on the
                  # arm64 runner.
                  architecture: ${{ matrix.arch }}
            - name: Install the conformance kit
              # The leg's config imports the kit; nothing is built on these runners.
              run: pnpm install --frozen-lockfile --prod --filter "@crossbind/e2e-desktop-app..."
            - name: Restore the app
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: windows-app
                  path: ünicode/e2e/desktop-app/dist
            - name: Run the conformance suite in the app
              run: node e2e/desktop-app/e2e/run.mjs
            - name: Install the app with its setup program
              run: |
                  $setup = Start-Process -Wait -PassThru -FilePath e2e\desktop-app\dist\crossbind-e2e-desktop-app-win32-${{ matrix.arch }}-setup.exe -ArgumentList /S
                  if ($setup.ExitCode -ne 0) { throw "the setup program exited with $($setup.ExitCode)" }
            - name: Check that the app, its setup program and its uninstaller carry the build's signature
              run: |
                  $files = "e2e\desktop-app\dist\crossbind-e2e-desktop-app-win32-${{ matrix.arch }}\crossbind-e2e-desktop-app.exe",
                      "e2e\desktop-app\dist\crossbind-e2e-desktop-app-win32-${{ matrix.arch }}-setup.exe",
                      "$env:LOCALAPPDATA\Programs\crossbind-e2e-desktop-app\uninstall.exe"
                  foreach ($file in $files) {
                      # The throwaway key is trusted nowhere, so a sound signature by it reads as untrusted, not as
                      # missing or broken.
                      $signature = Get-AuthenticodeSignature $file
                      if ($signature.Status -in 'NotSigned', 'HashMismatch', 'NotSupportedFileFormat') { throw "$file has no sound signature: $($signature.Status)" }
                      if ($signature.SignerCertificate.Subject -ne 'CN=crossbind e2e') { throw "$file is not signed by the build's key: $($signature.SignerCertificate.Subject)" }
                      if (-not $signature.TimeStamperCertificate) { throw "$file has no timestamp" }
                  }
            - name: Run the conformance suite in the installed app
              run: node e2e/desktop-app/e2e/run.mjs --installed
            - name: Update the installed app as its updater does, which waits for the app to quit, opens it again and removes the URL schemes it no longer lists
              run: |
                  $app = "$env:LOCALAPPDATA\Programs\crossbind-e2e-desktop-app"
                  $exe = "$app\crossbind-e2e-desktop-app.exe"
                  # A scheme a release before registered and this one no longer lists, and another app's.
                  $dropped = 'HKCU:\Software\Classes\crossbind-e2e-dropped'
                  $foreign = 'HKCU:\Software\Classes\crossbind-e2e-foreign'
                  foreach ($scheme in $dropped, $foreign) {
                      New-Item -Path "$scheme\shell\open\command" -Force | Out-Null
                      Set-ItemProperty -LiteralPath $scheme -Name 'URL Protocol' -Value ''
                  }
                  Set-Item -LiteralPath "$dropped\shell\open\command" -Value "`"$exe`" `"%1`""
                  Set-Item -LiteralPath "$foreign\shell\open\command" -Value '"C:\elsewhere\app.exe" "%1"'
                  $running = Start-Process -PassThru -FilePath $exe
                  $setup = Start-Process -PassThru -FilePath e2e\desktop-app\dist\crossbind-e2e-desktop-app-win32-${{ matrix.arch }}-setup.exe -ArgumentList "/S /UPDATE /D=$app"
                  # PowerShell reads a process's exit code through a handle it took while the process ran.
                  $null = $setup.Handle
                  Start-Sleep -Seconds 3
                  if ($setup.HasExited) { throw "the update did not wait for the app to quit" }
                  Stop-Process -Id $running.Id -Force
                  if (-not $setup.WaitForExit(60000)) { throw 'the update did not finish once the app had quit' }
                  if ($setup.ExitCode -ne 0) { throw "the update exited with $($setup.ExitCode)" }
                  if (Test-Path $dropped) { throw "the update left $dropped, which the app no longer lists" }
                  foreach ($path in $foreign, 'HKCU:\Software\Classes\crossbind-e2e') { if (-not (Test-Path $path)) { throw "the update removed $path" } }
                  $opened = $null
                  for ($i = 0; $i -lt 30 -and -not $opened; $i++) {
                      Start-Sleep -Seconds 1
                      $opened = Get-Process -Name crossbind-e2e-desktop-app -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe -and $_.Id -ne $running.Id }
                  }
                  if (-not $opened) { throw 'the update did not open the app again' }
                  # The uninstaller stops while the app runs.
                  $opened | Stop-Process -Force
                  $opened | Wait-Process -Timeout 30
            - name: Uninstall the app, which takes its shortcut, its files, its entry in Settings and its URL schemes
              run: |
                  $app = "$env:LOCALAPPDATA\Programs\crossbind-e2e-desktop-app"
                  $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\crossbind-e2e-desktop-app.lnk"
                  $entry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\dev.crossbind.crossbind-e2e-desktop-app'
                  $scheme = 'HKCU:\Software\Classes\crossbind-e2e'
                  # A scheme of the app it no longer lists, as an uninstaller before this one left behind.
                  $dropped = 'HKCU:\Software\Classes\crossbind-e2e-dropped'
                  $foreign = 'HKCU:\Software\Classes\crossbind-e2e-foreign'
                  New-Item -Path "$dropped\shell\open\command" -Force | Out-Null
                  Set-ItemProperty -LiteralPath $dropped -Name 'URL Protocol' -Value ''
                  Set-Item -LiteralPath "$dropped\shell\open\command" -Value "`"$app\crossbind-e2e-desktop-app.exe`" `"%1`""
                  foreach ($path in $shortcut, $entry, $scheme) { if (-not (Test-Path $path)) { throw "the setup program left out $path" } }
                  # A link of app.urlSchemes opens the app with the link as its argument, as the suite launches it.
                  $command = (Get-Item -LiteralPath "$scheme\shell\open\command").GetValue('')
                  if ($command -ne "`"$app\crossbind-e2e-desktop-app.exe`" `"%1`"") { throw "a link of the scheme runs $command" }
                  $uninstall = Start-Process -Wait -PassThru -FilePath "$app\uninstall.exe" -ArgumentList /S
                  if ($uninstall.ExitCode -ne 0) { throw "the uninstaller exited with $($uninstall.ExitCode)" }
                  # It finishes from a copy of itself, whose last step removes the folder.
                  for ($i = 0; $i -lt 30 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
                  foreach ($path in $app, $shortcut, $entry, $scheme, $dropped) { if (Test-Path $path) { throw "the uninstaller left $path" } }
                  if (-not (Test-Path $foreign)) { throw "the uninstaller removed $foreign, another app's" }
                  Remove-Item -LiteralPath $foreign -Recurse
    app-android:
        # The Android app's host and Rust build in crossbind's android-app image, its bridges in the web image, and Gradle
        # packages the app in the android-app image too; it runs on an emulator.
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            CROSSBIND_APP_PLATFORM: android
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Build the app
              run: pnpm --filter=@crossbind/e2e-desktop-app run build
            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            - name: Run the conformance suite in the app on an emulator
              uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              with:
                  api-level: 36
                  target: default
                  arch: x86_64
                  emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                  disable-animations: true
                  script: pnpm --filter=@crossbind/e2e-desktop-app run e2e:prod
