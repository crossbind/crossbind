name: test android sample
on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - core/**
            - tooling/**
            - ports/**
            - plugins/**
            - examples/**
            - e2e/**
            - .nvmrc
            - .github/workflows/test-android-sample.yml
    pull_request:
        branches:
            - main
        paths:
            - core/crossbind/**
            - plugins/metro/**
            - plugins/react-native/**
            - examples/lib-prebuilt-matrix/**
            - examples/mobile-reactnative-cli/**
            - .nvmrc
            - .github/workflows/test-android-sample.yml

permissions: {}
jobs:
    # Emulator-free fast lane: exercises the gradle config-phase scripts (bridges, deps
    # stamp, assets) and the CMake configure chain (params file, prefab) in ~2-3 minutes.
    configure-only:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
              with:
                  distribution: 'temurin'
                  java-version: '17'
            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Install NDK and CMake
              run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;4.1.2" > /dev/null
            - name: Build examples/lib-prebuilt-matrix
              run: pnpm --filter=@crossbind/example-lib-prebuilt-matrix run build:android
            - name: Gradle cache
              uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
            - name: CMake configure (x86_64)
              working-directory: examples/mobile-reactnative-cli/android
              run: ./gradlew ":crossbind_plugin-react-native:configureCMakeDebug[x86_64]" -PreactNativeArchitectures=x86_64 --console=plain

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
              with:
                  distribution: 'temurin'
                  java-version: '17'
            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Build examples/lib-prebuilt-matrix
              run: pnpm --filter=@crossbind/example-lib-prebuilt-matrix run build:android

            - name: Install Maestro
              run: |
                  curl -fsSL "https://get.maestro.mobile.dev" | bash
                  echo "$HOME/.maestro/bin" >> $GITHUB_PATH
            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            - name: Gradle cache
              uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
            - name: create AVD
              uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              with:
                  api-level: 36
                  target: default
                  arch: x86_64
                  cmake: 4.1.2
                  ndk: 29.0.14206865
                  force-avd-creation: false
                  emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                  disable-animations: false
                  script: echo "Generated AVD snapshot for caching."
            - name: E2E Android
              uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              with:
                  api-level: 36
                  target: default
                  arch: x86_64
                  cmake: 4.1.2
                  ndk: 29.0.14206865
                  force-avd-creation: false
                  emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                  disable-animations: true
                  script: |
                      adb logcat --clear
                      adb logcat '*:D' > adb-log.txt &
                      pnpm run ci:android:e2e
            - name: Upload Adb Logs
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: Adb Logs
                  path: adb-log.txt
            - name: Upload report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: E2E Report
                  path: ~/.maestro/tests/**/*
