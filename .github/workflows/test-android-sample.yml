name: test android sample
on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - core/**
            - extensions/**
            - tooling/**
            - ports/**
            - plugins/**
            - examples/**
            - e2e/**
            - .nvmrc
            - .github/workflows/test-android-sample.yml
            - '!**/*.md'
    pull_request:
        branches:
            - main
        paths:
            - core/crossbind/**
            - plugins/metro/**
            - plugins/react-native/**
            - examples/lib-prebuilt-matrix/**
            - examples/mobile-reactnative-cli/**
            - .nvmrc
            - .github/workflows/test-android-sample.yml
            - '!**/*.md'

permissions: {}
concurrency:
    # A newer push to the same pull request or branch supersedes the running checks.
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
jobs:
    tested:
        uses: ./.github/workflows/tested-tree.yml
        permissions:
            actions: read
            contents: read
            pull-requests: read
        with:
            workflow: test-android-sample.yml
    # Emulator-free fast lane: exercises the gradle config-phase scripts (bridges, deps
    # stamp, assets) and the CMake configure chain (params file, prefab) in ~2-3 minutes.
    configure-only:
        needs: tested
        if: needs.tested.outputs.tested != 'true'
        runs-on: ubuntu-latest
        # main's pushes alone reach the ci-cache environment, whose secrets write the compiler cache; it records no deployment.
        environment:
            name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ci-cache' || '' }}
            deployment: false
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
              with:
                  distribution: 'temurin'
                  java-version: '17'
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Set up the compiler cache
              uses: ./.github/actions/setup-sccache
              with:
                  read-key-id: ${{ secrets.SCCACHE_R2_READ_KEY_ID }}
                  read-secret: ${{ secrets.SCCACHE_R2_READ_SECRET }}
                  write-key-id: ${{ secrets.SCCACHE_R2_WRITE_KEY_ID }}
                  write-secret: ${{ secrets.SCCACHE_R2_WRITE_SECRET }}
                  endpoint: ${{ vars.SCCACHE_R2_ENDPOINT }}
            - name: Check that hermes-compiler is the version react-native depends on
              run: node scripts/check-hermes-compiler.mjs
            - name: Install NDK and CMake
              run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null
            - name: Build examples/lib-prebuilt-matrix
              run: pnpm --filter=@crossbind/example-lib-prebuilt-matrix run build:android
            - name: Gradle cache
              uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
            - name: CMake configure (x86_64)
              working-directory: examples/mobile-reactnative-cli/android
              run: ./gradlew ":crossbind_plugin-react-native:configureCMakeDebug[x86_64]" -PreactNativeArchitectures=x86_64 --console=plain

    build:
        needs: tested
        if: needs.tested.outputs.tested != 'true'
        runs-on: ubuntu-latest
        # main's pushes alone reach the ci-cache environment, whose secrets write the compiler cache; it records no deployment.
        environment:
            name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ci-cache' || '' }}
            deployment: false
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
              with:
                  distribution: 'temurin'
                  java-version: '17'
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Set up the compiler cache
              uses: ./.github/actions/setup-sccache
              with:
                  read-key-id: ${{ secrets.SCCACHE_R2_READ_KEY_ID }}
                  read-secret: ${{ secrets.SCCACHE_R2_READ_SECRET }}
                  write-key-id: ${{ secrets.SCCACHE_R2_WRITE_KEY_ID }}
                  write-secret: ${{ secrets.SCCACHE_R2_WRITE_SECRET }}
                  endpoint: ${{ vars.SCCACHE_R2_ENDPOINT }}
            - name: Build examples/lib-prebuilt-matrix
              run: pnpm --filter=@crossbind/example-lib-prebuilt-matrix run build:android

            - name: Install Maestro
              run: |
                  curl -fsSL "https://get.maestro.mobile.dev" | bash
                  echo "$HOME/.maestro/bin" >> $GITHUB_PATH
            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            - name: Gradle cache
              uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
            - name: create AVD
              uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              with:
                  api-level: 36
                  target: default
                  arch: x86_64
                  cmake: 4.1.2
                  ndk: 30.0.16248370
                  force-avd-creation: false
                  emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                  disable-animations: false
                  script: echo "Generated AVD snapshot for caching."
            - name: E2E Android
              uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              with:
                  api-level: 36
                  target: default
                  arch: x86_64
                  cmake: 4.1.2
                  ndk: 30.0.16248370
                  force-avd-creation: false
                  emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                  disable-animations: true
                  script: |
                      adb logcat --clear
                      adb logcat '*:D' > adb-log.txt &
                      pnpm run ci:android:e2e
            - name: Upload Adb Logs
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: Adb Logs
                  path: adb-log.txt
            - name: Upload report
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: E2E Report
                  path: ~/.maestro/tests/**/*
