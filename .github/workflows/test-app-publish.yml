name: test app publish
# Publishes e2e/app-publish, the stores' test app, to Google Play's internal track and to TestFlight, as app.md's
# "From CI" does. Never from a pull request: a fork's or Dependabot's run gets no secrets, and every upload is a build
# the testers get, under an upload limit Apple keeps for the whole account. The weekly run sees what changes with no
# commit: the runner's Xcode, and the stores.
on:
    workflow_dispatch:
    schedule:
        - cron: '17 3 * * 5'
    push:
        branches:
            - main
        # What only publishing runs, or what shows only in a store.
        paths:
            - core/crossbind/src/actions/publishAndroid.js
            - core/crossbind/src/actions/publishIos.js
            - core/crossbind/src/actions/googlePlay.js
            - core/crossbind/src/actions/googleSignIn.js
            - core/crossbind/src/actions/playSetup.js
            - core/crossbind/src/actions/appStoreConnect.js
            - core/crossbind/src/actions/appleSigning.js
            - core/crossbind/src/actions/appSetup.js
            - core/crossbind/src/actions/androidGradle.js
            - core/crossbind/src/utils/secretFile.js
            - core/crossbind/src/utils/requiredReasonApis.js
            - core/crossbind/src/utils/hermes.js
            - e2e/app-publish/**
            - .github/workflows/test-app-publish.yml

permissions: {}
concurrency:
    # One publish at a time, and none cut off: two Play edits at once clash.
    group: ${{ github.workflow }}
    cancel-in-progress: false
jobs:
    android:
        # The app-publish environment, open to main alone, holds the secrets; Workload Identity Federation gives the
        # play-publisher service account's token to this repository's jobs in it, with no key.
        runs-on: ubuntu-latest
        timeout-minutes: 60
        environment: app-publish
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Sign in to Google Play
              id: google
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
              with:
                  workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
                  token_format: access_token
                  access_token_scopes: https://www.googleapis.com/auth/androidpublisher
                  create_credentials_file: false
            - name: Publish to Google Play's internal track
              run: pnpm --filter=@crossbind/e2e-app-publish run publish:android
              env:
                  CROSSBIND_GOOGLE_PLAY_TOKEN: ${{ steps.google.outputs.access_token }}
                  CROSSBIND_ANDROID_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEY }}
                  CROSSBIND_ANDROID_KEY_ALIAS: upload
                  CROSSBIND_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    ios:
        # The archive is unsigned, and the export signs in the cloud with the Admin key: the runner has no certificate.
        runs-on: macos-latest
        timeout-minutes: 60
        environment: app-publish
        permissions:
            contents: read
        env:
            CROSSBIND_RUNNER: LOCAL
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            # Fetched once per version and kept, with the dSYM every upload carries. The key is not app-ios's, whose
            # cache has no dSYM: a saved key never takes more.
            - name: Restore Hermes
              id: hermes
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.crossbind/hermes
                  key: hermes-dsym-${{ runner.os }}-${{ hashFiles('core/crossbind/src/utils/hermes.js') }}
            - name: Fetch Hermes and its dSYM
              if: steps.hermes.outputs.cache-hit != 'true'
              timeout-minutes: 15
              run: node --input-type=module -e "const hermes = await import('./core/crossbind/src/utils/hermes.js'); await hermes.default(); await hermes.resolveHermesDsym()"
            - name: Save Hermes
              if: steps.hermes.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.crossbind/hermes
                  key: ${{ steps.hermes.outputs.cache-primary-key }}
            - name: Publish to App Store Connect for TestFlight
              run: pnpm --filter=@crossbind/e2e-app-publish run publish:ios
              env:
                  CROSSBIND_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
                  CROSSBIND_APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
                  CROSSBIND_APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
