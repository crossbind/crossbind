name: deploy landing
on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    # A published release changes what the site shows without touching the repository: the build
    # resolves its snapshot from live npm and GitHub data, so a release has to redeploy on its own.
    workflow_run:
        workflows:
            - Release npm package train
        types:
            - completed

permissions:
    contents: read

concurrency:
    # Unlike the release trains, a superseded run has nothing to contribute: the run that replaces
    # it publishes newer content to the same place.
    group: crossbind-landing-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

# The demos main's deploy keeps for later runs, in two caches: the ones installed from npm change with a release or
# their own sources, the samples and app pictures built from this repository with most commits. Each demo's record
# says whether its files can be kept.
env:
    # The wildcard names each entry: actions/cache archives a listed directory whole, so only a named entry can be left out.
    NPM_DEMOS: |
        landing/public/examples/*
        !landing/public/examples/demos.json
        !landing/public/examples/sample-*
        !landing/public/examples/apps
    REPO_DEMOS: |
        landing/public/examples/sample-*
        landing/public/examples/apps

# No path filter: the site reads CHANGELOG.md, releases/, ports metadata, scripts/site and
# landing/, and resolves the rest from live npm, so any filter narrow enough to be useful would
# miss a source.
jobs:
    # Everything the deploy does except the upload, so a pull request proves the pipeline still
    # runs on a runner. The job declares no environment, so it cannot read the Cloudflare
    # credentials even when the pull request edits this file.
    verify:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # /packages/ reads every release from the tags and the history between them.
                  fetch-depth: 0
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            # The demo build opens every template in a real browser to check that its WebAssembly
            # module answers; a runner has no browser until Playwright downloads one.
            - name: Install the smoke-test browser
              run: pnpm exec playwright install --with-deps chromium
            # A pull request starts from the newest demos main's deploy kept and builds only those its changes reach.
            - name: Restore the demos built from npm
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.NPM_DEMOS }}
                  key: landing-npm-demos
                  restore-keys: landing-npm-demos-
            - name: Restore the samples and app pictures
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.REPO_DEMOS }}
                  key: landing-repo-demos
                  restore-keys: landing-repo-demos-
            # The demos are gitignored and the deploy gate refuses a snapshot without them.
            - name: Build the live example demos
              run: pnpm --filter @crossbind/landing run demos
            # The Examples page shows every library app at work, captured from the demos just built; the gate
            # refuses a site without those pictures too.
            - name: Capture the app pictures
              run: pnpm --filter @crossbind/landing run previews
              env:
                  GH_TOKEN: ${{ github.token }}
            - name: Build and gate the site
              run: pnpm --filter @crossbind/landing run check:deploy
              env:
                  # The snapshot lists the published releases through the gh CLI, which reads no
                  # ambient credentials on a runner.
                  GH_TOKEN: ${{ github.token }}

    deploy:
        # A failed or cancelled release must not reach Cloudflare.
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
        runs-on: ubuntu-latest
        environment: pages-deploy
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # /packages/ reads every release from the tags and the history between them.
                  fetch-depth: 0
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Install the smoke-test browser
              run: pnpm exec playwright install --with-deps chromium
            - name: Restore the demos built from npm
              id: npm-demos
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.NPM_DEMOS }}
                  key: landing-npm-demos
                  restore-keys: landing-npm-demos-
            - name: Restore the samples and app pictures
              id: repo-demos
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.REPO_DEMOS }}
                  key: landing-repo-demos
                  restore-keys: landing-repo-demos-
            - name: Build the live example demos
              run: pnpm --filter @crossbind/landing run demos
            # Saved as soon as they change, and from a failed build too: a newer push cancels this run, and the next one
            # should not build them again.
            - name: Keep the demos built from npm
              if: >-
                  ${{ !cancelled() && steps.npm-demos.outputs.cache-matched-key != format('landing-npm-demos-{0}',
                  hashFiles('landing/public/examples/*/demo.json', '!landing/public/examples/sample-*/demo.json')) }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.NPM_DEMOS }}
                  key: landing-npm-demos-${{ hashFiles('landing/public/examples/*/demo.json', '!landing/public/examples/sample-*/demo.json') }}
            - name: Capture the app pictures
              run: pnpm --filter @crossbind/landing run previews
              env:
                  GH_TOKEN: ${{ github.token }}
            - name: Keep the samples and app pictures
              if: >-
                  ${{ !cancelled() && steps.repo-demos.outputs.cache-matched-key != format('landing-repo-demos-{0}',
                  hashFiles('landing/public/examples/sample-*/demo.json', 'landing/public/examples/apps/previews.json')) }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.REPO_DEMOS }}
                  key: landing-repo-demos-${{ hashFiles('landing/public/examples/sample-*/demo.json', 'landing/public/examples/apps/previews.json') }}
            - name: Build, gate and deploy
              run: pnpm --filter @crossbind/landing run deploy
              env:
                  GH_TOKEN: ${{ github.token }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
