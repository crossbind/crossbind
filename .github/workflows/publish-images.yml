# Publishes the crossbind image family to GHCR, mirrors it to Docker Hub, and emits the digest
# table the CLI pins against.
#
# Manual on purpose: this pushes multi-gigabyte images under a stable tag. Run it with push=false
# first - that still builds and uploads every image on every architecture, but tags them
# ci-<run id> instead of the release version, so nothing claims to be the release until you say so.
# (web and android are FROM base and buildx resolves that from the registry, so a dry run that
# uploaded nothing could not build them at all. Delete the ci-* tags afterwards.)
#
# The order is forced, not stylistic: web and android are FROM base, and buildx resolves that
# reference from the registry, so base must exist there before they can build. Each stage consumes
# the previous one by DIGEST, so an image can never be built on top of a tag that moved underneath.

name: Publish images

on:
  workflow_dispatch:
    inputs:
      push:
        description: Publish to the registries (leave off for a build-only dry run)
        type: boolean
        default: false
      mirror:
        description: Also mirror to Docker Hub
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ inputs.push && steps.v.outputs.version || format('ci-{0}', github.run_id) }}
      registry: ghcr.io/${{ github.repository_owner }}
      both: '[{"platform":"linux/amd64","runner":"ubuntu-latest"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]'
      # Google ships the linux NDK host tools for x86_64 only.
      amd64: '[{"platform":"linux/amd64","runner":"ubuntu-latest"}]'
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(tr -d '[:space:]' < tooling/docker/VERSION)" >> "$GITHUB_OUTPUT"

  sysroot:
    needs: setup
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: rust-sysroot
      dockerfile: rust-sysroot.Dockerfile
      target: sysroot
      tag: ${{ needs.setup.outputs.tag }}
      runners: ${{ needs.setup.outputs.both }}

  base:
    needs: setup
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: base
      dockerfile: base.Dockerfile
      target: base
      tag: ${{ needs.setup.outputs.tag }}
      runners: ${{ needs.setup.outputs.both }}

  web:
    needs: [setup, base, sysroot]
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: web
      dockerfile: web.Dockerfile
      target: web
      tag: ${{ needs.setup.outputs.tag }}
      runners: ${{ needs.setup.outputs.both }}
      build-args: |
        BASE_IMAGE=${{ needs.setup.outputs.registry }}/base@${{ needs.base.outputs.digest }}
        RUST_SYSROOT_IMAGE=${{ needs.setup.outputs.registry }}/rust-sysroot@${{ needs.sysroot.outputs.digest }}

  android:
    needs: [setup, base]
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: android
      dockerfile: android.Dockerfile
      target: android
      tag: ${{ needs.setup.outputs.tag }}
      runners: ${{ needs.setup.outputs.amd64 }}
      build-args: |
        BASE_IMAGE=${{ needs.setup.outputs.registry }}/base@${{ needs.base.outputs.digest }}

  mirror:
    needs: [setup, sysroot, base, web, android]
    if: inputs.push && inputs.mirror
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Copied by digest, so the mirror carries the same bytes rather than a rebuild that happens
      # to look alike. verify-mirror re-reads both registries and fails if they diverge.
      - name: Copy each index to Docker Hub
        env:
          V: ${{ needs.setup.outputs.version }}
          GHCR: ${{ needs.setup.outputs.registry }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for image in rust-sysroot base web android; do
            docker buildx imagetools create \
              --tag "docker.io/${OWNER}/${image}:${V}" \
              "${GHCR}/${image}:${V}"
          done

  digests:
    needs: [setup, sysroot, base, web, android]
    if: inputs.push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The CLI needs both: the index digest for a native pull, and the platform leaf for the
      # forced-platform path (android on an arm64 host), because the classic image store holds one
      # platform per digest reference. Taken from the raw manifest, not from a formatted view.
      - name: Emit the digest table
        env:
          V: ${{ needs.setup.outputs.version }}
          GHCR: ${{ needs.setup.outputs.registry }}
        run: |
          set -euo pipefail
          echo "{\"version\":\"${V}\",\"registry\":\"${GHCR}\",\"images\":{}}" > digests.json
          for image in rust-sysroot base web android; do
            docker buildx imagetools inspect "${GHCR}/${image}:${V}" --raw > "raw-${image}.json"
            index="sha256:$(sha256sum "raw-${image}.json" | cut -d' ' -f1)"
            jq --arg i "$image" --arg d "$index" --slurpfile m "raw-${image}.json" \
              '.images[$i] = {index: $d, platforms: ($m[0].manifests // [] | map(select(.platform.os == "linux"))
                 | map({key: ("linux/" + .platform.architecture), value: .digest}) | from_entries)}' \
              digests.json > tmp.json && mv tmp.json digests.json
          done
          jq . digests.json
          { echo '### Digest table'; echo '```json'; jq . digests.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: digests
          path: |
            digests.json
            raw-*.json


  # The sysroots ship twice: as a layer inside the web image, and as this archive for RUNNER=LOCAL.
  # Packed from the PUBLISHED image rather than rebuilt, so the two channels carry the same bytes by
  # construction and the manifest inside is the same contract the CLI verifies.
  sysroot-artifact:
    needs: [setup, sysroot]
    if: inputs.push
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pack the sysroot archive
        run: node scripts/pack-rust-sysroot.js --image "${{ needs.setup.outputs.registry }}/rust-sysroot:${{ needs.setup.outputs.tag }}"
      - name: Attach it to a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: rust-sysroot-${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          cd tooling/docker/dist
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "Rust sysroot ${{ needs.setup.outputs.version }}" \
                 --notes "Prebuilt st/mt Rust sysroots for RUNNER=LOCAL, packed from the ${{ needs.setup.outputs.version }} image."
          gh release upload "$TAG" ./*.tar ./*.tar.sha256 manifest.json --clobber
          tar_name="$(basename ./*.tar)"
          {
            echo "{"
            echo "  \"version\": \"${{ needs.setup.outputs.version }}\","
            echo "  \"url\": \"${{ github.server_url }}/${{ github.repository }}/releases/download/${TAG}/${tar_name}\","
            echo "  \"sha256\": \"$(cut -d' ' -f1 < ./*.tar.sha256)\""
            echo "}"
          } > sysroot-pin.json
          jq . sysroot-pin.json
          { echo '### Rust sysroot artifact'; echo '```json'; jq . sysroot-pin.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sysroot-pin
          path: tooling/docker/dist/sysroot-pin.json

  # Release gate (rev 6.6): what the toolchain must REFUSE. smoke-images asserts the image has what
  # it promises; this asserts it cannot be talked out of being stable - against the real Linux cargo
  # in the image, because config discovery, flag precedence and RUSTC_BOOTSTRAP are cargo's
  # behaviour, not ours. A unit test can only pin what we pass.


  # Release gate (rev 6.6): the OTHER consumption channel. The image build probes the sysroots it
  # embeds; nothing yet proves the tarball a host downloads is consumable - relocatable, offline,
  # matching the compiler on PATH. Gated on the archive just uploaded, so a bad one cannot be
  # pinned, across the host OSes crossbind supports for RUNNER=LOCAL.
  gate-local-sysroot:
    needs: [setup, sysroot-artifact]
    if: inputs.push
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: actions/download-artifact@v4
        with:
          name: sysroot-pin
      - name: Gate the published artifact
        run: |
          set -euo pipefail
          node scripts/gate-local-sysroot.js \
            --url "$(jq -r .url sysroot-pin.json)" \
            --sha256 "$(jq -r .sha256 sysroot-pin.json)"

  # Rev 6.6: the mirror is compared from the RAW bodies both registries serve - index, every linux
  # platform manifest, and each manifest's config and layer digests - because an index-only check
  # proves the two agree on a pointer, not on an image. The signature is verified SEPARATELY on each
  # registry: a copy that dropped the referrers would still pass a check run only on the primary.
  # Rev 7.2 §3: three DIFFERENT things, asserted separately, because passing one says nothing about
  # the others. A sign command that exits 0 has not proved the signature is discoverable; a
  # discoverable referrer has not proved it verifies; and a check run only on the primary has not
  # proved the mirror carries anything at all.
  verify-mirror:
    needs: [setup, mirror]
    if: inputs.push && inputs.mirror
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: The mirror must carry the same index digests
        env:
          V: ${{ needs.setup.outputs.version }}
          GHCR: ${{ needs.setup.outputs.registry }}
          HUB: docker.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail
          fail=0
          for image in rust-sysroot base web android; do
            a=$(docker buildx imagetools inspect "${GHCR}/${image}:${V}" --raw | sha256sum | cut -d' ' -f1)
            b=$(docker buildx imagetools inspect "${HUB}/${image}:${V}" --raw | sha256sum | cut -d' ' -f1)
            if [ "$a" = "$b" ]; then
              echo "ok   ${image}  sha256:${a}"
            else
              echo "FAIL ${image}  ghcr=sha256:${a}  hub=sha256:${b}"
              fail=1
            fi
          done
          exit $fail
