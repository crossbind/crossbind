# Builds and publishes the crossbind image family to canonical GHCR, then emits the digest table
# the CLI pins against. Enterprise consumers can mirror those exact digests into their own registry.
#
# Manual on purpose: this pushes multi-gigabyte images under a stable tag. The default dry run
# builds and smoke-tests the family on native runners without writing to any registry. A writing
# run publishes hidden staging tags and promotes the same digests only after every gate passes.
#
# The order is forced, not stylistic: web and android are FROM base, and buildx resolves that
# reference from the registry, so base must exist there before they can build. Each stage consumes
# the previous one by DIGEST, so an image can never be built on top of a tag that moved underneath.

name: Publish images

on:
    workflow_dispatch:
        inputs:
            dry_run:
                description: Build and validate locally without writing to a registry
                type: boolean
                default: true

permissions:
    contents: read

concurrency:
    group: crossbind-toolchain-release
    cancel-in-progress: false

jobs:
    setup:
        runs-on: ubuntu-24.04
        outputs:
            version: ${{ steps.v.outputs.version }}
            # Build-once/promote-digest (rev 7.2 §6): a push run publishes under a staging tag and only
            # earns the stable one after every gate has passed on exactly these bytes.
            tag: ${{ format('v{0}-staging-{1}', steps.v.outputs.version, github.run_id) }}
            registry: ghcr.io/${{ github.repository_owner }}
            both: '[{"platform":"linux/amd64","runner":"ubuntu-24.04"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]'
            # Google ships the linux NDK host tools for x86_64 only.
            amd64: '[{"platform":"linux/amd64","runner":"ubuntu-24.04"}]'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Require main before any registry write
              if: ${{ !inputs.dry_run }}
              run: |
                  set -euo pipefail
                  [ "${GITHUB_REF}" = refs/heads/main ] || {
                    echo "Toolchain releases must be dispatched from main, got ${GITHUB_REF}."
                    exit 1
                  }
            - id: v
              run: echo "version=$(tr -d '[:space:]' < tooling/docker/VERSION)" >> "$GITHUB_OUTPUT"

    # One approval protects every downstream registry write. Configure toolchain-release with a
    # required reviewer, no self-review/bypass, and a main-only deployment branch rule.
    authorize:
        needs: setup
        if: ${{ !inputs.dry_run }}
        runs-on: ubuntu-24.04
        environment: toolchain-release
        permissions:
            contents: read
        steps:
            - run: echo "Authorized toolchain image ${{ needs.setup.outputs.version }} from ${GITHUB_SHA}."

    # A real dry run: native local images, no login, packages:write permission or registry output.
    dry-run:
        needs: setup
        if: ${{ inputs.dry_run }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { arch: amd64, runner: ubuntu-24.04, suffix: -amd64, android: true }
                    - { arch: arm64, runner: ubuntu-24.04-arm, suffix: '', android: false }
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  package-manager-cache: false
            - name: Build the native image family locally
              working-directory: tooling/docker
              env:
                  ARCH: ${{ matrix.arch }}
                  SUFFIX: ${{ matrix.suffix }}
                  BUILD_ANDROID: ${{ matrix.android }}
              run: |
                  set -euo pipefail
                  docker build --platform "linux/${ARCH}" -f rust-sysroot.Dockerfile --target sysroot \
                    -t "crossbind/rust-sysroot:dev${SUFFIX}" .
                  docker build --platform "linux/${ARCH}" -f base.Dockerfile --target base \
                    -t "crossbind/base:dev${SUFFIX}" .
                  docker build --platform "linux/${ARCH}" -f web.Dockerfile --target web \
                    --build-arg "BASE_IMAGE=crossbind/base:dev${SUFFIX}" \
                    --build-arg "RUST_SYSROOT_IMAGE=crossbind/rust-sysroot:dev${SUFFIX}" \
                    -t "crossbind/web:dev${SUFFIX}" .
                  if [ "${BUILD_ANDROID}" = true ]; then
                    docker build --platform linux/amd64 -f android.Dockerfile --target android \
                      --build-arg "BASE_IMAGE=crossbind/base:dev-amd64" \
                      -t crossbind/android:dev .
                  fi
            - name: Smoke-test the locally built images under the hardened runtime profile
              run: |
                  targets=("base:${{ matrix.arch }}" "web:${{ matrix.arch }}")
                  if [ "${{ matrix.android }}" = true ]; then targets+=(android:amd64); fi
                  node scripts/smoke-images.js "${targets[@]}"
            - name: Scan local base image without writing a shared cache
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  version: v0.74.0
                  cache: false
                  scan-type: image
                  scan-ref: crossbind/base:dev${{ matrix.suffix }}
                  scanners: vuln
                  vuln-type: os,library
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
                  exit-code: 1
                  timeout: 20m
            - name: Scan local web image without writing a shared cache
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  version: v0.74.0
                  cache: false
                  scan-type: image
                  scan-ref: crossbind/web:dev${{ matrix.suffix }}
                  scanners: vuln
                  vuln-type: os,library
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
                  exit-code: 1
                  timeout: 20m
            - name: Scan local Android image without writing a shared cache
              if: ${{ matrix.android }}
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  version: v0.74.0
                  cache: false
                  scan-type: image
                  scan-ref: crossbind/android:dev
                  scanners: vuln
                  vuln-type: os,library
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
                  exit-code: 1
                  timeout: 20m

    sysroot:
        needs: [setup, authorize]
        if: ${{ !inputs.dry_run }}
        uses: ./.github/workflows/publish-image.yml
        permissions:
            contents: read
            packages: write
        with:
            image: rust-sysroot
            dockerfile: rust-sysroot.Dockerfile
            target: sysroot
            tag: ${{ needs.setup.outputs.tag }}
            release-version: ${{ needs.setup.outputs.version }}
            runners: ${{ needs.setup.outputs.both }}

    base:
        needs: [setup, authorize]
        if: ${{ !inputs.dry_run }}
        uses: ./.github/workflows/publish-image.yml
        permissions:
            contents: read
            packages: write
        with:
            image: base
            dockerfile: base.Dockerfile
            target: base
            tag: ${{ needs.setup.outputs.tag }}
            release-version: ${{ needs.setup.outputs.version }}
            runners: ${{ needs.setup.outputs.both }}

    web:
        needs: [setup, base, sysroot]
        uses: ./.github/workflows/publish-image.yml
        permissions:
            contents: read
            packages: write
        with:
            image: web
            dockerfile: web.Dockerfile
            target: web
            tag: ${{ needs.setup.outputs.tag }}
            release-version: ${{ needs.setup.outputs.version }}
            runners: ${{ needs.setup.outputs.both }}
            build-args: |
                BASE_IMAGE=${{ needs.setup.outputs.registry }}/base@${{ needs.base.outputs.digest }}
                RUST_SYSROOT_IMAGE=${{ needs.setup.outputs.registry }}/rust-sysroot@${{ needs.sysroot.outputs.digest }}

    android:
        needs: [setup, base]
        uses: ./.github/workflows/publish-image.yml
        permissions:
            contents: read
            packages: write
        with:
            image: android
            dockerfile: android.Dockerfile
            target: android
            tag: ${{ needs.setup.outputs.tag }}
            release-version: ${{ needs.setup.outputs.version }}
            runners: ${{ needs.setup.outputs.amd64 }}
            build-args: |
                BASE_IMAGE=${{ needs.setup.outputs.registry }}/base@${{ needs.base.outputs.digest }}

    # The release digest is signed on canonical GHCR. Keyless: the identity is this workflow, proved
    # by the GitHub OIDC token, and no stored signing key or registry credential is involved.
    #
    # Storage mode is pinned rather than negotiated (rev 6.6 leaves the choice free, not the pinning):
    # OCI 1.1 referrers. Tool versions are pinned because storage semantics have changed between
    # releases.
    # Signing (ADR rev 7.2). Two things are pinned here and neither is cosmetic.
    #
    # SCOPE: every public image's root index, PLUS the android linux/amd64 leaf. The CLI pins that
    # leaf directly - a classic image store holds one platform per digest reference - and a consumer
    # verifying the leaf cannot discover a signature attached only to the root. Signing --recursive
    # would attach one to every leaf of every image; we sign the one that is actually consumed.
    #
    # STORAGE: GHCR's OCI 1.1 referrers TAG SCHEMA, pinned rather than negotiated. The cosign v2
    # `.sig` layout is a different scheme and is asserted absent.
    sign:
        needs: [setup, sysroot, base, web, android]
        if: ${{ !inputs.dry_run }}
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
            id-token: write
        steps:
            - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
              with:
                  cosign-release: v3.1.3
            - name: The pinned version is the one that runs
              run: |
                  set -euo pipefail
                  got=$(cosign version 2>&1 | sed -n 's/^GitVersion:[[:space:]]*//p')
                  [ "$got" = v3.1.3 ] || { echo "cosign is $got, expected v3.1.3"; exit 1; }
                  echo "cosign $got"
            - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
              with:
                  version: v0.35.0
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}
            # The certificate this job mints carries job_workflow_ref as its identity, and the policy that
            # verifies it later is an exact string. Checking that here costs nothing and fails in seconds;
            # discovering a mismatch at verification time means a whole publish run - build and sign -
            # was spent learning it. The value is logged either way, so a mismatch names the real one.
            - name: The signing identity must be the one the policy accepts
              env:
                  EXPECTED: crossbind/crossbind/.github/workflows/publish-images.yml@refs/heads/main
              run: |
                  set -euo pipefail
                  actual='${{ github.workflow_ref }}'
                  echo "job_workflow_ref: ${actual}"
                  echo "expected        : ${EXPECTED}"
                  [ "$actual" = "$EXPECTED" ] || {
                    echo "refusing to sign: the certificate identity would not match the verification policy"
                    exit 1
                  }
            - name: Sign each root index, and the android leaf the CLI pins
              env:
                  V: ${{ needs.setup.outputs.tag }}
                  GHCR: ${{ needs.setup.outputs.registry }}
                  COSIGN_YES: 'true'
              run: |
                  set -euo pipefail
                  digest_of() { docker buildx imagetools inspect "$1" --raw | sha256sum | cut -d' ' -f1; }

                  for image in rust-sysroot base web android; do
                    root="sha256:$(digest_of "${GHCR}/${image}:${V}")"
                    cosign sign "${GHCR}/${image}@${root}"
                    echo "signed ${image} root ${root}"
                  done

                  # The android leaf, signed as its own subject.
                  root="sha256:$(digest_of "${GHCR}/android:${V}")"
                  leaf=$(docker buildx imagetools inspect "${GHCR}/android@${root}" --raw \
                    | jq -r '.manifests[] | select(.platform.os=="linux" and .platform.architecture=="amd64") | .digest')
                  [ -n "$leaf" ] || { echo "the android index carries no linux/amd64 leaf"; exit 1; }
                  cosign sign "${GHCR}/android@${leaf}"
                  echo "signed android linux/amd64 leaf ${leaf}"

            # Subject verification, on the primary, before anything is copied: each signature is found
            # through the native referrers API and its manifest's .subject.digest must equal the digest we
            # signed. cosign triangulate is deliberately not used - it is the deprecated legacy-tag path,
            # and this release stores signatures as native OCI 1.1 referrers.
            - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
              with:
                  version: 1.3.3
            - name: The pinned oras is the one that runs
              run: |
                  set -euo pipefail
                  got=$(oras version | sed -n 's/^Version:[[:space:]]*//p')
                  [ "$got" = 1.3.3 ] || { echo "oras is $got, expected 1.3.3"; exit 1; }
                  echo "oras $got"
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
            - name: Every signature must name the digest it was made for
              run: |
                  node scripts/gate-referrers.js --primary-only \
                    --tag "${{ needs.setup.outputs.tag }}" \
                    --primary "${{ needs.setup.outputs.registry }}"

    digests:
        needs: [setup, sysroot, base, web, android]
        if: ${{ !inputs.dry_run }}
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
              with:
                  version: v0.35.0
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}
            # The CLI needs both: the index digest for a native pull, and the platform leaf for the
            # forced-platform path (android on an arm64 host), because the classic image store holds one
            # platform per digest reference. Taken from the raw manifest, not from a formatted view.
            - name: Emit the digest table
              env:
                  V: ${{ needs.setup.outputs.tag }}
                  # The table names the RELEASE, not the tag the bytes happen to sit under while they are
                  # being gated: the digests do not change when the stable tag is added, and a pin that
                  # recorded the staging tag would refuse to match tooling/docker/VERSION.
                  RELEASE: ${{ needs.setup.outputs.version }}
                  GHCR: ${{ needs.setup.outputs.registry }}
              run: |
                  set -euo pipefail
                  rust=$(sed -n 's/^ARG RUST_VERSION=//p' tooling/docker/rust-sysroot.Dockerfile | head -1)
                  [[ "$rust" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
                    echo "rust-sysroot.Dockerfile has no exact RUST_VERSION"
                    exit 1
                  }
                  jq -n --arg version "$RELEASE" --arg registry "$GHCR" --arg rust "$rust" \
                    '{version: $version, registry: $registry, toolchains: {rust: $rust}, images: {}}' > digests.json
                  for image in rust-sysroot base web android; do
                    docker buildx imagetools inspect "${GHCR}/${image}:${V}" --raw > "raw-${image}.json"
                    index="sha256:$(sha256sum "raw-${image}.json" | cut -d' ' -f1)"
                    jq --arg i "$image" --arg d "$index" --slurpfile m "raw-${image}.json" \
                      '.images[$i] = {index: $d, platforms: ($m[0].manifests // [] | map(select(.platform.os == "linux"))
                         | map({key: ("linux/" + .platform.architecture), value: .digest}) | from_entries)}' \
                      digests.json > tmp.json && mv tmp.json digests.json
                  done
                  jq . digests.json
                  { echo '### Digest table'; echo '```json'; jq . digests.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: digests
                  path: |
                      digests.json
                      raw-*.json

    gate-attestations:
        needs: [setup, sysroot, base, web, android]
        if: ${{ !inputs.dry_run }}
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  package-manager-cache: false
            - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
              with:
                  version: v0.35.0
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}
            - name: Require subject-bound SLSA provenance and SPDX SBOM
              run: |
                  node scripts/gate-image-attestations.mjs \
                    --tag "${{ needs.setup.outputs.tag }}" \
                    --registry "${{ needs.setup.outputs.registry }}"

    scan:
        needs: [setup, sysroot, base, web, android]
        if: ${{ !inputs.dry_run }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { image: rust-sysroot, platform: linux/amd64 }
                    - { image: rust-sysroot, platform: linux/arm64 }
                    - { image: base, platform: linux/amd64 }
                    - { image: base, platform: linux/arm64 }
                    - { image: web, platform: linux/amd64 }
                    - { image: web, platform: linux/arm64 }
                    - { image: android, platform: linux/amd64 }
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: read
        steps:
            - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
              with:
                  version: v0.35.0
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}
            - name: Resolve the exact platform leaf
              id: subject
              env:
                  IMAGE: ${{ matrix.image }}
                  PLATFORM: ${{ matrix.platform }}
                  TAG: ${{ needs.setup.outputs.tag }}
                  REGISTRY: ${{ needs.setup.outputs.registry }}
                  RUST_SYSROOT_ROOT: ${{ needs.sysroot.outputs.digest }}
                  BASE_ROOT: ${{ needs.base.outputs.digest }}
                  WEB_ROOT: ${{ needs.web.outputs.digest }}
                  ANDROID_ROOT: ${{ needs.android.outputs.digest }}
              run: |
                  set -euo pipefail
                  case "${IMAGE}" in
                    rust-sysroot) root="${RUST_SYSROOT_ROOT}" ;;
                    base) root="${BASE_ROOT}" ;;
                    web) root="${WEB_ROOT}" ;;
                    android) root="${ANDROID_ROOT}" ;;
                    *) echo "unknown image ${IMAGE}"; exit 1 ;;
                  esac
                  arch="${PLATFORM#linux/}"
                  leaf=$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE}@${root}" --raw \
                    | jq -er --arg arch "${arch}" '.manifests[] | select(.platform.os=="linux" and .platform.architecture==$arch) | .digest')
                  echo "ref=${REGISTRY}/${IMAGE}@${leaf}" >> "$GITHUB_OUTPUT"
                  echo "Scanning ${REGISTRY}/${IMAGE}@${leaf} (${PLATFORM})"
            - name: Refuse fixable high or critical vulnerabilities
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  version: v0.74.0
                  scan-type: image
                  scan-ref: ${{ steps.subject.outputs.ref }}
                  scanners: vuln
                  vuln-type: os,library
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
                  exit-code: 1
                  timeout: 20m
                  github-pat: ${{ github.token }}

    # Release gate (rev 6.6): what the toolchain must REFUSE. smoke-images asserts the image has what
    # it promises; this asserts it cannot be talked out of being stable - against the real Linux cargo
    # in the image, because config discovery, flag precedence and RUSTC_BOOTSTRAP are cargo's
    # behaviour, not ours. A unit test can only pin what we pass.
    gate-toolchain:
        needs: [setup, web]
        if: ${{ !inputs.dry_run }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { arch: amd64, runner: ubuntu-24.04 }
                    - { arch: arm64, runner: ubuntu-24.04-arm }
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}
            - run: node scripts/gate-toolchain.js --published --tag ${{ needs.setup.outputs.tag }} --arch ${{ matrix.arch }}

    # Release gate (rev 6.6): the OTHER consumption channel. The image build probes the sysroots it
    # embeds; this proves a HOST build can read the very same layer straight out of the registry -
    # relocatable, offline, matching the compiler on PATH - across the OSes RUNNER=LOCAL supports.
    # There is no second artifact to publish, so the two channels cannot drift.
    gate-local-sysroot:
        needs: [setup, sysroot]
        if: ${{ !inputs.dry_run }}
        strategy:
            fail-fast: false
            matrix:
                runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            # This gate drives the CLI's own loader rather than a copy of it, which is the point - so it
            # needs the CLI's dependencies. The other gates import nothing but node builtins.
            - run: pnpm install --frozen-lockfile
            # NOT @stable. Prebuilt rlibs are consumable only by the compiler that produced them, so the
            # host here has to be the rustc the sysroot was built with - the gate refuses anything else,
            # correctly, and @stable moves out from under it the day upstream releases.
            - id: rustc
              run: |
                  set -euo pipefail
                  v=$(sed -n 's/^ARG RUST_VERSION=//p' tooling/docker/rust-sysroot.Dockerfile | head -1)
                  [ -n "$v" ] || { echo "no RUST_VERSION in rust-sysroot.Dockerfile"; exit 1; }
                  echo "version=$v" >> "$GITHUB_OUTPUT"
                  echo "sysroot rustc: $v"
            - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-05
              with:
                  toolchain: ${{ steps.rustc.outputs.version }}
                  targets: wasm32-unknown-emscripten
            - name: Gate the sysroot image this run published
              run: |
                  node scripts/gate-local-sysroot.js \
                    --image "${{ needs.setup.outputs.registry }}/rust-sysroot" \
                    --index "${{ needs.sysroot.outputs.digest }}"

    # Verification is intentionally separate from signing and has no id-token, so this job can prove
    # an existing signature but cannot mint the identity it is supposed to trust.
    verify-signatures:
        needs: [setup, sign]
        if: ${{ !inputs.dry_run }}
        runs-on: ubuntu-24.04
        # No id-token: this job only reads and verifies. The OIDC token is what lets a job MINT a
        # signing identity, so it belongs to the sign job alone.
        permissions:
            contents: read
            packages: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
            - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
              with:
                  version: v0.35.0
            - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
              with:
                  cosign-release: v3.1.3
            - name: The pinned version is the one that runs
              run: |
                  set -euo pipefail
                  c=$(cosign version 2>&1 | sed -n 's/^GitVersion:[[:space:]]*//p')
                  [ "$c" = v3.1.3 ] || { echo "cosign is $c, expected v3.1.3"; exit 1; }
                  echo "cosign $c"
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}

            # Cryptographic verification on every public subject by digest, plus two near-miss identities
            # that prove neither another branch nor another workflow can satisfy the release policy.
            - name: Signatures must verify, and a wrong identity must not
              env:
                  V: ${{ needs.setup.outputs.tag }}
                  GHCR: ${{ needs.setup.outputs.registry }}
                  ISSUER: https://token.actions.githubusercontent.com
                  # Exact, not a pattern: this release has exactly one legitimate signer, and every
                  # character a regex leaves loose is a signer it would also accept.
                  IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-images.yml@refs/heads/main
              run: |
                  set -euo pipefail
                  echo "expected signer identity: $IDENTITY"

                  verify() { # $1 = ref
                    cosign verify --certificate-identity "$IDENTITY" \
                      --certificate-oidc-issuer "$ISSUER" "$1" > /tmp/v.json
                    jq -r '.[0].optional.Subject // "(no subject)"' /tmp/v.json
                  }

                  for image in rust-sysroot base web android; do
                    root="sha256:$(docker buildx imagetools inspect "${GHCR}/${image}:${V}" --raw | sha256sum | cut -d' ' -f1)"
                    subject=$(verify "${GHCR}/${image}@${root}")
                    echo "ok  ${GHCR}/${image} root ${root}  signer=${subject}"
                  done
                  leaf=$(docker buildx imagetools inspect "${GHCR}/android:${V}" --raw \
                    | jq -r '.manifests[] | select(.platform.os=="linux" and .platform.architecture=="amd64") | .digest')
                  subject=$(verify "${GHCR}/android@${leaf}")
                  echo "ok  ${GHCR}/android linux/amd64 leaf ${leaf}  signer=${subject}"

                  # Negative cases, and they are deliberately NEAR misses. An obviously foreign identity
                  # would be refused even by a policy that ignored the ref and the workflow file entirely,
                  # so it proves nothing about the two things that actually matter here: only this workflow
                  # signs, and only from main. Each is asserted on its own, and each must exit non-zero.
                  root="sha256:$(docker buildx imagetools inspect "${GHCR}/web:${V}" --raw | sha256sum | cut -d' ' -f1)"
                  refuse() { # $1 = label, $2 = identity that must NOT verify
                    if cosign verify --certificate-identity "$2" \
                         --certificate-oidc-issuer "$ISSUER" "${GHCR}/web@${root}" >/dev/null 2>&1; then
                      echo "FAIL  ${1}: verified under ${2}"; exit 1
                    fi
                    echo "ok    ${1} is refused"
                  }
                  repo="https://github.com/${{ github.repository }}/.github/workflows"
                  refuse "the same workflow from another branch" "${repo}/publish-images.yml@refs/heads/not-main"
                  refuse "another workflow in this repository"   "${repo}/build-linux.yml@refs/heads/main"

    # The stable tag is the LAST thing that happens, and it only points at bytes every gate above has
    # already accepted. Nothing is rebuilt - `oras tag` points a name at a digest that already exists.
    promote:
        needs: [setup, digests, verify-signatures, gate-toolchain, gate-local-sysroot, gate-attestations, scan]
        if: ${{ !inputs.dry_run }}
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
            - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
              with:
                  version: v0.35.0
            - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
              with:
                  version: 1.3.3
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}
            - name: Promote the staged digests to the stable tag
              run: |
                  node scripts/promote-tags.js \
                    --version "${{ needs.setup.outputs.version }}" \
                    --staging "${{ needs.setup.outputs.tag }}" \
                    --primary "${{ needs.setup.outputs.registry }}"
