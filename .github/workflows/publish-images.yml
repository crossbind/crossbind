# Publishes the crossbind image family to GHCR, mirrors it to Docker Hub, and emits the digest
# table the CLI pins against.
#
# Manual on purpose: this pushes multi-gigabyte images under a stable tag. Run it with push=false
# first - that still builds and uploads every image on every architecture, but tags them
# ci-<run id> instead of the release version, so nothing claims to be the release until you say so.
# (web and android are FROM base and buildx resolves that from the registry, so a dry run that
# uploaded nothing could not build them at all. Delete the ci-* tags afterwards.)
#
# The order is forced, not stylistic: web and android are FROM base, and buildx resolves that
# reference from the registry, so base must exist there before they can build. Each stage consumes
# the previous one by DIGEST, so an image can never be built on top of a tag that moved underneath.

name: Publish images

on:
  workflow_dispatch:
    inputs:
      push:
        description: Publish to the registries (leave off for a build-only dry run)
        type: boolean
        default: false
      mirror:
        description: Also mirror to Docker Hub
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      # Build-once/promote-digest (rev 7.2 §6): a push run publishes under a staging tag and only
      # earns the stable one after every gate has passed on exactly these bytes.
      tag: ${{ inputs.push && format('v{0}-staging-{1}', steps.v.outputs.version, github.run_id) || format('ci-{0}', github.run_id) }}
      registry: ghcr.io/${{ github.repository_owner }}
      both: '[{"platform":"linux/amd64","runner":"ubuntu-latest"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]'
      # Google ships the linux NDK host tools for x86_64 only.
      amd64: '[{"platform":"linux/amd64","runner":"ubuntu-latest"}]'
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(tr -d '[:space:]' < tooling/docker/VERSION)" >> "$GITHUB_OUTPUT"

  sysroot:
    needs: setup
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: rust-sysroot
      dockerfile: rust-sysroot.Dockerfile
      target: sysroot
      tag: ${{ needs.setup.outputs.tag }}
      runners: ${{ needs.setup.outputs.both }}

  base:
    needs: setup
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: base
      dockerfile: base.Dockerfile
      target: base
      tag: ${{ needs.setup.outputs.tag }}
      runners: ${{ needs.setup.outputs.both }}

  web:
    needs: [setup, base, sysroot]
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: web
      dockerfile: web.Dockerfile
      target: web
      tag: ${{ needs.setup.outputs.tag }}
      runners: ${{ needs.setup.outputs.both }}
      build-args: |
        BASE_IMAGE=${{ needs.setup.outputs.registry }}/base@${{ needs.base.outputs.digest }}
        RUST_SYSROOT_IMAGE=${{ needs.setup.outputs.registry }}/rust-sysroot@${{ needs.sysroot.outputs.digest }}

  android:
    needs: [setup, base]
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: android
      dockerfile: android.Dockerfile
      target: android
      tag: ${{ needs.setup.outputs.tag }}
      runners: ${{ needs.setup.outputs.amd64 }}
      build-args: |
        BASE_IMAGE=${{ needs.setup.outputs.registry }}/base@${{ needs.base.outputs.digest }}

  # The release digest is signed ONCE, on the primary, and the signature then travels to the mirror
  # with the image - never re-signed there, or the two registries would carry different attestations
  # for the same bytes. Keyless: the identity is this workflow, proved by the GitHub OIDC token.
  #
  # Storage mode is pinned rather than negotiated (rev 6.6 leaves the choice free, not the pinning):
  # OCI 1.1 referrers, so `oras cp -r` carries the signature as part of the image graph. Tool
  # versions are pinned for the same reason - copy semantics have changed between releases.
  # Signing (ADR rev 7.2). Two things are pinned here and neither is cosmetic.
  #
  # SCOPE: every public image's root index, PLUS the android linux/amd64 leaf. The CLI pins that
  # leaf directly - a classic image store holds one platform per digest reference - and a consumer
  # verifying the leaf cannot discover a signature attached only to the root. Signing --recursive
  # would attach one to every leaf of every image; we sign the one that is actually consumed.
  #
  # STORAGE: the OCI 1.1 referrers TAG SCHEMA, pinned rather than negotiated. cosign v3.1.3 needs no
  # --registry-referrers-mode flag: it writes whatever the registry supports, and GHCR does not
  # implement the referrers API (HTTP 404 on /v2/.../referrers/) while Docker Hub does. Left to
  # negotiate, the same signature would be stored one way here and another way on the mirror. So
  # every copy and every discovery below forces the tag schema, and the cosign v2 `.sig` layout -
  # a different scheme - is asserted absent.
  sign:
    needs: [setup, sysroot, base, web, android]
    if: inputs.push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: The pinned version is the one that runs
        run: |
          set -euo pipefail
          got=$(cosign version 2>&1 | sed -n 's/^GitVersion:[[:space:]]*//p')
          [ "$got" = v3.1.3 ] || { echo "cosign is $got, expected v3.1.3"; exit 1; }
          echo "cosign $got"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The certificate this job mints carries job_workflow_ref as its identity, and the policy that
      # verifies it later is an exact string. Checking that here costs nothing and fails in seconds;
      # discovering a mismatch at verification time means a whole publish run - build, sign, mirror -
      # was spent learning it. The value is logged either way, so a mismatch names the real one.
      - name: The signing identity must be the one the policy accepts
        env:
          EXPECTED: crossbind/crossbind/.github/workflows/publish-images.yml@refs/heads/main
        run: |
          set -euo pipefail
          actual='${{ github.workflow_ref }}'
          echo "job_workflow_ref: ${actual}"
          echo "expected        : ${EXPECTED}"
          [ "$actual" = "$EXPECTED" ] || {
            echo "refusing to sign: the certificate identity would not match the verification policy"
            exit 1
          }
      - name: Sign each root index, and the android leaf the CLI pins
        env:
          V: ${{ needs.setup.outputs.tag }}
          GHCR: ${{ needs.setup.outputs.registry }}
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          digest_of() { docker buildx imagetools inspect "$1" --raw | sha256sum | cut -d' ' -f1; }

          for image in rust-sysroot base web android; do
            root="sha256:$(digest_of "${GHCR}/${image}:${V}")"
            cosign sign "${GHCR}/${image}@${root}"
            echo "signed ${image} root ${root}"
          done

          # The android leaf, signed as its own subject.
          root="sha256:$(digest_of "${GHCR}/android:${V}")"
          leaf=$(docker buildx imagetools inspect "${GHCR}/android@${root}" --raw \
            | jq -r '.manifests[] | select(.platform.os=="linux" and .platform.architecture=="amd64") | .digest')
          [ -n "$leaf" ] || { echo "the android index carries no linux/amd64 leaf"; exit 1; }
          cosign sign "${GHCR}/android@${leaf}"
          echo "signed android linux/amd64 leaf ${leaf}"

      # Subject verification, on the primary, before anything is copied: each signature is found
      # through the native referrers API and its manifest's .subject.digest must equal the digest we
      # signed. cosign triangulate is deliberately not used - it is the deprecated legacy-tag path,
      # and this release stores signatures as native OCI 1.1 referrers.
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3
      - name: The pinned oras is the one that runs
        run: |
          set -euo pipefail
          got=$(oras version | sed -n 's/^Version:[[:space:]]*//p')
          [ "$got" = 1.3.3 ] || { echo "oras is $got, expected 1.3.3"; exit 1; }
          echo "oras $got"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Every signature must name the digest it was made for
        run: |
          node scripts/gate-referrers.js --primary-only \
            --tag "${{ needs.setup.outputs.tag }}" \
            --primary "${{ needs.setup.outputs.registry }}"

  # oras carries the image graph AND its referrer graph in one operation, converting between the two
  # registries' modes: GHCR holds the OCI 1.1 tag schema because it does not implement the referrers
  # API (HTTP 404), Docker Hub implements it. Both ends are declared rather than negotiated, so a
  # registry that changes capability fails here instead of moving the signature somewhere unwatched.
  # Proved locally end to end - the conversion preserves the descriptors, the subject digests, and
  # cosign's ability to verify on the destination.
  mirror:
    needs: [setup, sign]
    if: inputs.push && inputs.mirror
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3
      - name: The pinned version is the one that runs
        run: |
          set -euo pipefail
          got=$(oras version | sed -n 's/^Version:[[:space:]]*//p')
          [ "$got" = 1.3.3 ] || { echo "oras is $got, expected 1.3.3"; exit 1; }
          echo "oras $got"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy each image and its referrers, native API on both ends
        env:
          V: ${{ needs.setup.outputs.tag }}
          GHCR: ${{ needs.setup.outputs.registry }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for image in rust-sysroot base web android; do
            oras cp -r \
              --from-distribution-spec v1.1-referrers-tag \
              --to-distribution-spec v1.1-referrers-api \
              "${GHCR}/${image}:${V}" "docker.io/${OWNER}/${image}:${V}"
          done

  digests:
    needs: [setup, sysroot, base, web, android]
    if: inputs.push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The CLI needs both: the index digest for a native pull, and the platform leaf for the
      # forced-platform path (android on an arm64 host), because the classic image store holds one
      # platform per digest reference. Taken from the raw manifest, not from a formatted view.
      - name: Emit the digest table
        env:
          V: ${{ needs.setup.outputs.tag }}
          # The table names the RELEASE, not the tag the bytes happen to sit under while they are
          # being gated: the digests do not change when the stable tag is added, and a pin that
          # recorded the staging tag would refuse to match tooling/docker/VERSION.
          RELEASE: ${{ needs.setup.outputs.version }}
          GHCR: ${{ needs.setup.outputs.registry }}
        run: |
          set -euo pipefail
          echo "{\"version\":\"${RELEASE}\",\"registry\":\"${GHCR}\",\"images\":{}}" > digests.json
          for image in rust-sysroot base web android; do
            docker buildx imagetools inspect "${GHCR}/${image}:${V}" --raw > "raw-${image}.json"
            index="sha256:$(sha256sum "raw-${image}.json" | cut -d' ' -f1)"
            jq --arg i "$image" --arg d "$index" --slurpfile m "raw-${image}.json" \
              '.images[$i] = {index: $d, platforms: ($m[0].manifests // [] | map(select(.platform.os == "linux"))
                 | map({key: ("linux/" + .platform.architecture), value: .digest}) | from_entries)}' \
              digests.json > tmp.json && mv tmp.json digests.json
          done
          jq . digests.json
          { echo '### Digest table'; echo '```json'; jq . digests.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: digests
          path: |
            digests.json
            raw-*.json

  # Release gate (rev 6.6): what the toolchain must REFUSE. smoke-images asserts the image has what
  # it promises; this asserts it cannot be talked out of being stable - against the real Linux cargo
  # in the image, because config discovery, flag precedence and RUSTC_BOOTSTRAP are cargo's
  # behaviour, not ours. A unit test can only pin what we pass.
  gate-toolchain:
    needs: [setup, web]
    if: inputs.push
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: node scripts/gate-toolchain.js --published --tag ${{ needs.setup.outputs.tag }} --arch ${{ matrix.arch }}

  # Release gate (rev 6.6): the OTHER consumption channel. The image build probes the sysroots it
  # embeds; this proves a HOST build can read the very same layer straight out of the registry -
  # relocatable, offline, matching the compiler on PATH - across the OSes RUNNER=LOCAL supports.
  # There is no second artifact to publish, so the two channels cannot drift.
  gate-local-sysroot:
    needs: [setup, sysroot]
    if: inputs.push
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
      # This gate drives the CLI's own loader rather than a copy of it, which is the point - so it
      # needs the CLI's dependencies. The other gates import nothing but node builtins.
      - run: pnpm install --frozen-lockfile
      # NOT @stable. Prebuilt rlibs are consumable only by the compiler that produced them, so the
      # host here has to be the rustc the sysroot was built with - the gate refuses anything else,
      # correctly, and @stable moves out from under it the day upstream releases.
      - id: rustc
        run: |
          set -euo pipefail
          v=$(sed -n 's/^ARG RUST_VERSION=//p' tooling/docker/rust-sysroot.Dockerfile | head -1)
          [ -n "$v" ] || { echo "no RUST_VERSION in rust-sysroot.Dockerfile"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sysroot rustc: $v"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-05
        with:
          toolchain: ${{ steps.rustc.outputs.version }}
          targets: wasm32-unknown-emscripten
      - name: Gate the sysroot image this run published
        run: |
          node scripts/gate-local-sysroot.js \
            --image "${{ needs.setup.outputs.registry }}/rust-sysroot" \
            --index "${{ needs.sysroot.outputs.digest }}"

  # Rev 6.6: the mirror is compared from the RAW bodies both registries serve - index, every linux
  # platform manifest, and each manifest's config and layer digests - because an index-only check
  # proves the two agree on a pointer, not on an image. The signature is verified SEPARATELY on each
  # registry: a copy that dropped the referrers would still pass a check run only on the primary.
  # Rev 7.2 §3: three DIFFERENT things, asserted separately, because passing one says nothing about
  # the others. A sign command that exits 0 has not proved the signature is discoverable; a
  # discoverable referrer has not proved it verifies; and a check run only on the primary has not
  # proved the mirror carries anything at all.
  verify-mirror:
    needs: [setup, mirror]
    if: inputs.push && inputs.mirror
    runs-on: ubuntu-latest
    # No id-token: this job only reads and verifies. The OIDC token is what lets a job MINT a
    # signing identity, so it belongs to the sign job alone.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3
      - name: The pinned versions are the ones that run
        run: |
          set -euo pipefail
          c=$(cosign version 2>&1 | sed -n 's/^GitVersion:[[:space:]]*//p')
          o=$(oras version | sed -n 's/^Version:[[:space:]]*//p')
          [ "$c" = v3.1.3 ] || { echo "cosign is $c, expected v3.1.3"; exit 1; }
          [ "$o" = 1.3.3 ] || { echo "oras is $o, expected 1.3.3"; exit 1; }
          echo "cosign $c, oras $o"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # §3 invariant 4/5: the mirror carries the same bytes, index to layers.
      - name: Both registries must agree, index to layers
        run: node scripts/gate-registry.js --tag ${{ needs.setup.outputs.tag }} --table digests.json

      # §3.2: discovery through the NATIVE API, on both registries, for every signed subject - with
      # the descriptor sets compared field by field rather than merely counted.
      - name: Referrer sets must match through the native API
        env:
          V: ${{ needs.setup.outputs.tag }}
          GHCR: ${{ needs.setup.outputs.registry }}
          HUB: docker.io/${{ github.repository_owner }}
        run: node scripts/gate-referrers.js --tag "$V" --primary "$GHCR" --mirror "$HUB"

      # §3.3 and §5: cryptographic verification on every subject, on BOTH registries, by digest -
      # and a deliberately wrong identity that must be refused. The expected identity is declared
      # here, printed, and compared: a mismatch fails the release rather than widening the policy.
      - name: Signatures must verify, and a wrong identity must not
        env:
          V: ${{ needs.setup.outputs.tag }}
          GHCR: ${{ needs.setup.outputs.registry }}
          HUB: docker.io/${{ github.repository_owner }}
          ISSUER: https://token.actions.githubusercontent.com
          # Exact, not a pattern: this release has exactly one legitimate signer, and every
          # character a regex leaves loose is a signer it would also accept.
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-images.yml@refs/heads/main
        run: |
          set -euo pipefail
          echo "expected signer identity: $IDENTITY"

          verify() { # $1 = ref
            cosign verify --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" "$1" > /tmp/v.json
            jq -r '.[0].optional.Subject // "(no subject)"' /tmp/v.json
          }

          for registry in "$GHCR" "$HUB"; do
            for image in rust-sysroot base web android; do
              root="sha256:$(docker buildx imagetools inspect "${registry}/${image}:${V}" --raw | sha256sum | cut -d' ' -f1)"
              subject=$(verify "${registry}/${image}@${root}")
              echo "ok  ${registry}/${image} root ${root}  signer=${subject}"
            done
            leaf=$(docker buildx imagetools inspect "${registry}/android:${V}" --raw \
              | jq -r '.manifests[] | select(.platform.os=="linux" and .platform.architecture=="amd64") | .digest')
            subject=$(verify "${registry}/android@${leaf}")
            echo "ok  ${registry}/android linux/amd64 leaf ${leaf}  signer=${subject}"
          done

          # Negative cases, and they are deliberately NEAR misses. An obviously foreign identity
          # would be refused even by a policy that ignored the ref and the workflow file entirely,
          # so it proves nothing about the two things that actually matter here: only this workflow
          # signs, and only from main. Each is asserted on its own, and each must exit non-zero.
          root="sha256:$(docker buildx imagetools inspect "${GHCR}/web:${V}" --raw | sha256sum | cut -d' ' -f1)"
          refuse() { # $1 = label, $2 = identity that must NOT verify
            if cosign verify --certificate-identity "$2" \
                 --certificate-oidc-issuer "$ISSUER" "${GHCR}/web@${root}" >/dev/null 2>&1; then
              echo "FAIL  ${1}: verified under ${2}"; exit 1
            fi
            echo "ok    ${1} is refused"
          }
          repo="https://github.com/${{ github.repository }}/.github/workflows"
          refuse "the same workflow from another branch" "${repo}/publish-images.yml@refs/heads/not-main"
          refuse "another workflow in this repository"   "${repo}/build-linux.yml@refs/heads/main"

      # A distinct name: the digests job publishes the canonical table the CLI pins from, and two
      # artifacts sharing one name make it ambiguous which a consumer downloads. This one is the
      # verification record - the same graph, walked across both registries.
      - uses: actions/upload-artifact@v4
        with:
          name: digests-verified
          path: digests.json

  # The stable tag is the LAST thing that happens, and it only points at bytes every gate above has
  # already accepted: same digests on both registries, referrers discoverable natively on both,
  # signatures verifying on both, a wrong identity refused, and the toolchain and LOCAL artifact
  # gates green. Nothing is rebuilt - `oras tag` points a name at a digest that already exists.
  promote:
    needs: [setup, digests, verify-mirror, gate-toolchain, gate-local-sysroot]
    if: inputs.push && inputs.mirror
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: docker/setup-buildx-action@v3
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote the staged digests to the stable tag
        run: |
          node scripts/promote-tags.js \
            --version "${{ needs.setup.outputs.version }}" \
            --staging "${{ needs.setup.outputs.tag }}" \
            --primary "${{ needs.setup.outputs.registry }}" \
            --mirror "docker.io/${{ github.repository_owner }}"
