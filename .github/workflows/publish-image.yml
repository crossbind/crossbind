# One image of the crossbind family, built once per architecture on a native runner and merged
# into a multi-arch index. Called by publish-images.yml; not useful on its own.
#
# Per-architecture builds push by DIGEST (no tag), and only the merge step publishes a tag - so a
# half-finished run never leaves a tag pointing at one architecture.

name: Publish image

on:
  workflow_call:
    inputs:
      image:
        description: Image name under the registry namespace (base, web, android, rust-sysroot)
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      target:
        required: true
        type: string
      tag:
        description: Tag the merged index gets - the release version, or a scratch tag on a dry run
        required: true
        type: string
      runners:
        description: JSON array of {platform, runner} - native runners, no emulation
        required: true
        type: string
      build-args:
        description: Newline-separated ARG=value pairs
        required: false
        type: string
        default: ''
    outputs:
      digest:
        description: Index digest of the published image
        value: ${{ jobs.merge.outputs.digest }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  CONTEXT: tooling/docker

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The web image is ~4 GB and android carries the NDK; the runner's preinstalled SDKs are
      # dead weight that the build would otherwise compete with for disk.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build ${{ inputs.image }} (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ inputs.build-args }}
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true

      # A file per digest: matrix job outputs would overwrite each other. The sha256: prefix is
      # dropped from the name because upload-artifact rejects a colon in a path; merge puts it back.
      - name: Record digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ inputs.image }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ inputs.image }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create the multi-arch index
        id: index
        # imagetools create pulls every layer of every architecture through GHCR's blob CDN, and
        # that CDN resets connections - a run died here on "read: connection reset by peer" with
        # both architectures already pushed and the sysroot's own merge succeeding beside it.
        # Nothing about a retry is unsafe: the index is derived from digests that already exist, so
        # a second attempt produces the same bytes or fails the same way.
        run: |
          set -euo pipefail
          cd /tmp/digests
          refs=()
          for file in *; do refs+=("${REGISTRY}/${{ inputs.image }}@sha256:${file}"); done
          [ ${#refs[@]} -gt 0 ] || { echo "no per-architecture digests to merge"; exit 1; }
          for attempt in 1 2 3; do
            if docker buildx imagetools create \
                 --tag "${REGISTRY}/${{ inputs.image }}:${{ inputs.tag }}" "${refs[@]}"; then
              break
            fi
            [ "$attempt" = 3 ] && { echo "imagetools create failed three times - not a flake"; exit 1; }
            echo "imagetools create failed (attempt ${attempt}/3), retrying"
            sleep 10
          done
          digest=$(docker buildx imagetools inspect \
            "${REGISTRY}/${{ inputs.image }}:${{ inputs.tag }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "${{ inputs.image }}:${{ inputs.tag }} -> ${digest}" >> "$GITHUB_STEP_SUMMARY"
