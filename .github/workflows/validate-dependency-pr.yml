name: Validate dependency update

on:
    pull_request:
        branches:
            - main
        paths:
            - .nvmrc
            - tooling/docker/**
            - ports/**
            - core/crossbind/src/actions/run.js
            - core/crossbind/src/utils/linuxToolchain.js
            - core/crossbind/src/utils/windowsToolchain.js
            - .github/workflows/build-linux.yml
            - scripts/dependencies/**
            - scripts/gate-pinned-local-sysroot.mjs
            - .github/dependabot.yml
            - .github/workflows/dependency-*.yml
            - .github/workflows/validate-dependency-pr.yml
            - .github/actions/setup-trivy/**

permissions:
    contents: read

concurrency:
    group: dependency-pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    changes:
        runs-on: ubuntu-24.04
        outputs:
            families: ${{ steps.units.outputs.families }}
            linux_groups: ${{ steps.units.outputs.linux_groups }}
            linux_group_count: ${{ steps.units.outputs.linux_group_count }}
            macos_groups: ${{ steps.units.outputs.macos_groups }}
            macos_group_count: ${{ steps.units.outputs.macos_group_count }}
            toolchain: ${{ steps.units.outputs.toolchain }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - id: units
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: node scripts/dependencies/changed-units.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

    automation:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Test dependency automation and workflow policy
              run: pnpm run check:dependency-automation

    native-linux:
        needs: changes
        if: ${{ needs.changes.outputs.linux_group_count != '0' }}
        strategy:
            fail-fast: false
            max-parallel: 4
            matrix: ${{ fromJSON(needs.changes.outputs.linux_groups) }}
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            actions: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # From the release shard that builds the group's targets (classifyBuild, scripts/release/workspace-release.mjs).
            - name: Set up the compiler cache, from what the last release left
              uses: ./.github/actions/setup-sccache
              with:
                  dir: ${{ runner.temp }}/sccache
                  size: 4G
                  artifact: release-sccache-${{ fromJSON('{"wasm":"wasm","wasi":"wasi","linux":"linux-native","linuxmusl":"linux-native","android":"android","win32":"win32-native","base":"linux"}')[matrix.group] }}
                  token: ${{ github.token }}
            - name: Build each package of the changed native families once for one target group, then pack them
              env:
                  FAMILIES: ${{ needs.changes.outputs.families }}
                  GROUP: ${{ matrix.group }}
              run: node scripts/dependencies/validate-native-family.mjs --families "$FAMILIES" --platform linux --group "$GROUP"

    native-macos:
        needs: changes
        if: ${{ needs.changes.outputs.macos_group_count != '0' }}
        strategy:
            fail-fast: false
            max-parallel: 2
            matrix: ${{ fromJSON(needs.changes.outputs.macos_groups) }}
        runs-on: macos-15
        permissions:
            contents: read
            actions: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Set up the compiler cache, from what the last release left
              uses: ./.github/actions/setup-sccache
              with:
                  dir: ${{ runner.temp }}/sccache
                  size: 4G
                  artifact: release-sccache-macos
                  token: ${{ github.token }}
            - name: Build each package of the changed native families once for one target group, then pack them
              env:
                  FAMILIES: ${{ needs.changes.outputs.families }}
                  GROUP: ${{ matrix.group }}
              run: node scripts/dependencies/validate-native-family.mjs --families "$FAMILIES" --platform macos --group "$GROUP"
            # sccache finishes the cache writes it still holds as it stops.
            - name: Stop the compiler cache
              if: ${{ always() && env.CROSSBIND_SCCACHE == '1' }}
              run: sccache --stop-server || echo "No sccache server ran in this job."

    # One job per image, so the slow ones build side by side; each builds the base it starts from.
    toolchain:
        name: toolchain (${{ matrix.image }})
        needs: changes
        if: ${{ needs.changes.outputs.toolchain == 'build' }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - image: base
                      builds: build:base:amd64
                      tag: crossbind/base:dev-amd64
                    - image: web
                      builds: build:sysroot:amd64 build:base:amd64 build:web:amd64
                      tag: crossbind/web:dev-amd64
                    - image: android
                      builds: build:base:amd64 build:android
                      tag: crossbind/android:dev
                    - image: android-app
                      builds: build:base:amd64 build:android build:android-app
                      tag: crossbind/android-app:dev
                    - image: linux
                      builds: build:base:amd64 build:linux:amd64
                      tag: crossbind/linux:dev-amd64
                    - image: windows
                      builds: build:base:amd64 build:windows:amd64
                      tag: crossbind/windows:dev-amd64
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Build and smoke the image
              env:
                  BUILDS: ${{ matrix.builds }}
                  IMAGE: ${{ matrix.image }}
              run: |
                  for script in $BUILDS; do pnpm --dir tooling/docker run "$script"; done
                  node scripts/smoke-images.js "$IMAGE:amd64"
            - name: Run the CLI's image checks on the rebuilt Web image
              if: ${{ matrix.image == 'web' }}
              env:
                  CROSSBIND_IMAGE_WEB: crossbind/web:dev-amd64
              run: |
                  pnpm run gate:pinned-local-sysroot
                  pnpm run check:release:web
            - name: Set up Trivy once for this job
              timeout-minutes: 10
              uses: ./.github/actions/setup-trivy
              with:
                  version: v0.74.0
            - name: Scan the rebuilt image
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  version: v0.74.0
                  skip-setup-trivy: true
                  cache: false
                  scan-type: image
                  scan-ref: ${{ matrix.tag }}
                  scanners: vuln
                  vuln-type: os,library
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
                  exit-code: 1
                  timeout: 20m

    # Nothing an image is built from changed, so the CLI meets the images it runs with after the merge.
    toolchain-pinned:
        name: toolchain (pinned images)
        needs: changes
        if: ${{ needs.changes.outputs.toolchain == 'pinned' }}
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Run the CLI's image checks on the pinned images
              run: |
                  pnpm run gate:pinned-local-sysroot
                  pnpm run check:release:web
