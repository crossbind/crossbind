name: test templates
on:
    workflow_dispatch:
    schedule:
        - cron: '17 1 * * 1'

permissions:
    contents: read
jobs:
    # Scaffolds the web templates with this tree's create-crossbind and installs them from npm as a user would, then
    # builds them and runs their e2e: the workspace samples resolve through workspace links, which hide what a
    # standalone install gets. Weekly, to bound the cost.
    web:
        runs-on: ubuntu-latest
        timeout-minutes: 120
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Scaffold, build and test the web templates
              run: node scripts/e2e-templates.js --source local --filter web --json
            - name: Keep the logs
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: e2e-templates
                  path: tmp/e2e-templates/logs
                  if-no-files-found: ignore
