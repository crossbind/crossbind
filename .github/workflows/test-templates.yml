name: test templates
on:
    workflow_dispatch:
    schedule:
        - cron: '17 1 * * 1'

permissions:
    contents: read
jobs:
    # Scaffolds the web templates with this tree's create-crossbind and installs them from npm as a user would, then
    # builds them and runs their e2e: the workspace samples resolve through workspace links, which hide what a
    # standalone install gets. Weekly, to bound the cost.
    web:
        runs-on: ubuntu-latest
        timeout-minutes: 120
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Scaffold, build and test the web templates
              run: node scripts/e2e-templates.js --source local --filter web --json
            - name: Keep the logs
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: e2e-templates
                  path: tmp/e2e-templates/logs
                  if-no-files-found: ignore
