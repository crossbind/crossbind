name: rerun failed jobs
on:
    workflow_run:
        workflows:
            - build linux
            - build macos
            - test core
            - test node native sample
            - test conan node addons
            - test android sample
            - test ios sample
            - test node addon conformance
            - test e2e fixtures
        types:
            - completed

permissions: {}
jobs:
    # A runner, the network or GitHub's artifact store fails now and then, so a run of these that fails on its first
    # attempt runs its failed jobs once more, and a real failure fails again and stays red. A pull request's run that a
    # newer push superseded stays as it is: its rerun would cancel the newer run of its concurrency group. So do a
    # fork's runs and Dependabot's, whose token cannot rerun them.
    rerun:
        if: >-
            github.event.workflow_run.conclusion == 'failure'
            && github.event.workflow_run.run_attempt == 1
            && github.event.workflow_run.head_repository.full_name == github.repository
            && github.event.workflow_run.actor.login != 'dependabot[bot]'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            actions: write
        steps:
            - name: Rerun the failed jobs
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  RUN: ${{ github.event.workflow_run.id }}
                  WORKFLOW: ${{ github.event.workflow_run.workflow_id }}
                  BRANCH: ${{ github.event.workflow_run.head_branch }}
                  EVENT: ${{ github.event.workflow_run.event }}
              run: |
                  if [ "$EVENT" = pull_request ]; then
                      latest=$(gh run list --repo "$REPO" --workflow "$WORKFLOW" --branch "$BRANCH" --event "$EVENT" --limit 1 --json databaseId --jq '.[0].databaseId')
                      if [ "$latest" != "$RUN" ]; then
                          echo "Run $latest of $BRANCH supersedes run $RUN."
                          exit 0
                      fi
                  fi
                  gh run rerun "$RUN" --failed --repo "$REPO"
