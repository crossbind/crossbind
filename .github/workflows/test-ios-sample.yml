name: test ios sample
on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - core/**
            - tooling/**
            - ports/**
            - plugins/**
            - examples/**
            - e2e/**
            - .nvmrc
            - .github/workflows/test-ios-sample.yml
    pull_request:
        branches:
            - main
        paths:
            - core/crossbind/**
            - plugins/metro/**
            - plugins/react-native/**
            - plugins/react-native-ios-helper/**
            - examples/lib-prebuilt-matrix/**
            - examples/mobile-reactnative-cli/**
            - .nvmrc
            - .github/workflows/test-ios-sample.yml

permissions: {}
jobs:
    build:
        runs-on: macos-latest
        env:
            # Dependabot-triggered runs receive no repository secrets; the simulator build below does
            # not need signing, so skip the keychain setup instead of failing on an empty certificate.
            HAS_SIGNING_SECRETS: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install the Apple certificate and provisioning profile
              if: ${{ env.HAS_SIGNING_SECRETS == 'true' }}
              env:
                  BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
                  P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
                  BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
                  KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
              run: |
                  # create variables
                  CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
                  PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
                  KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

                  # import certificate and provisioning profile from secrets
                  echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
                  echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

                  # create temporary keychain
                  security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
                  security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

                  # import certificate to keychain
                  security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
                  security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
                  security list-keychain -d user -s $KEYCHAIN_PATH

                  # apply provisioning profile
                  mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
                  cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: |
                  pnpm install
                  pnpm crossbind config set XCODE_DEVELOPMENT_TEAM 7ZZLDWBUVT
            - name: Install Maestro
              run: |
                  curl -fsSL "https://get.maestro.mobile.dev" | bash
                  echo "$HOME/.maestro/bin" >> $GITHUB_PATH
            - name: Restore cached bridge files
              run: |
                  mkdir -p ./examples/mobile-reactnative-cli/.crossbind
                  cp -r ./examples/mobile-reactnative-cli/ci/crossbind-snapshot/. ./examples/mobile-reactnative-cli/.crossbind/
            - name: Build examples/lib-prebuilt-matrix
              run: pnpm --filter=@crossbind/example-lib-prebuilt-matrix run build:ios
            - name: Pod install
              # CocoaPods resolves paths through the symlink thicket a pnpm workspace creates and
              # intermittently dies on "pathname contains null byte" - its own issue list calls that one
              # "sometimes". Retrying costs a minute; letting a known flake fail the release path costs a
              # rerun of everything behind it. Three attempts, and the third failure is a real one.
              working-directory: examples/mobile-reactnative-cli/ios
              # React Native downloads prebuilt core, dependency and Hermes tarballs from Maven Central;
              # when that fails it silently builds them from source, which does not compile against
              # this react-native version and burns forty minutes first. Treat the fallback as a failed
              # attempt so a Maven hiccup gets a retry instead of a doomed build.
              run: |
                  set -euo pipefail
                  for attempt in 1 2 3; do
                    log="$RUNNER_TEMP/pod-install-${attempt}.log"
                    if pod install 2>&1 | tee "$log"; then
                      if grep -qE 'No prebuilt artifacts found|\[Hermes\] Using the latest commit' "$log"; then
                        echo "pod install fell back to building React Native or Hermes from source (attempt ${attempt}/3)"
                      else
                        exit 0
                      fi
                    else
                      echo "pod install failed (attempt ${attempt}/3)"
                    fi
                    sleep 30
                  done
                  echo "pod install could not use the prebuilt React Native artifacts three times - check Maven Central, this is not a flake"
                  exit 1
            - name: E2E IOS
              # The playground under e2e/ needs the full port matrix and its own pods; CI builds the
              # sample, the same boundary ci:linux:e2e draws.
              env:
                  # Simulator boot on hosted runners regularly exceeds Maestro's default driver timeout.
                  MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
              run: pnpm run ci:ios:e2e
