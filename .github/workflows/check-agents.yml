name: check agents
on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read
concurrency:
    # A new push to a pull request supersedes its running checks; a main commit keeps its own run.
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true
jobs:
    # No path filter: the gate reads docs/, ports/, agents/, landing/src and the root
    # instruction files, so any filter narrow enough to be useful would miss a source.
    surface:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
            - name: Agent surface and generated bundle
              run: pnpm run check:agents
