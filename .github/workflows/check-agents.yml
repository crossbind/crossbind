name: check agents
on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read
jobs:
    # No path filter: the gate reads docs/, ports/, agents/, landing/src and the root
    # instruction files, so any filter narrow enough to be useful would miss a source.
    surface:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
            - name: Agent surface and generated bundle
              run: pnpm run check:agents
