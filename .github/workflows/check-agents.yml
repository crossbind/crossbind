name: check agents
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
jobs:
  # No path filter: the gate reads docs/, ports/, agents/, landing/src and the root
  # instruction files, so any filter narrow enough to be useful would miss a source.
  surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Agent surface and generated bundle
        run: pnpm run check:agents
