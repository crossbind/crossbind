name: test node native sample
on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - core/**
            - examples/**
            - .nvmrc
            - .github/workflows/test-node-native-sample.yml
    pull_request:
        branches:
            - main
        paths:
            - core/crossbind/**
            - core/embind-jsi/**
            - core/embind-napi/**
            - examples/lib-prebuilt-matrix/**
            - examples/backend-nodejs-native/**
            - .nvmrc
            - .github/workflows/test-node-native-sample.yml

permissions: {}
jobs:
    build:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Restore cached bridge files
              # A macOS runner has no Docker and cannot run SWIG, so both packages' bridges come from
              # committed snapshots; regenerate them when the headers or the SWIG fork change.
              run: |
                  mkdir -p ./examples/lib-prebuilt-matrix/.crossbind ./examples/backend-nodejs-native/.crossbind
                  cp -r ./examples/backend-nodejs-native/ci/lib-prebuilt-matrix-snapshot/. ./examples/lib-prebuilt-matrix/.crossbind/
                  cp -r ./examples/backend-nodejs-native/ci/crossbind-snapshot/. ./examples/backend-nodejs-native/.crossbind/
            - name: Build examples/lib-prebuilt-matrix
              run: pnpm --filter=@crossbind/example-lib-prebuilt-matrix run build:darwin
            - name: Build examples/backend-nodejs-native
              run: pnpm --filter=@crossbind/example-backend-nodejs-native run build
            - name: Run the addon from CommonJS and ESM
              working-directory: examples/backend-nodejs-native
              run: |
                  set -euo pipefail
                  for entry in src/index.js src/index.mjs; do
                    out="$(node "$entry")"
                    echo "$out"
                    grep -qF '= 6*J₃' <<< "$out"
                  done
