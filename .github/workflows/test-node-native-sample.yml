name: test node native sample
on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - core/**
            - examples/**
            - plugins/vite/**
            - plugins/rollup/**
            - .nvmrc
            - .github/workflows/test-node-native-sample.yml
            - '!**/*.md'
    pull_request:
        branches:
            - main
        paths:
            - core/crossbind/**
            - core/embind-jsi/**
            - core/embind-napi/**
            - core/app-host/**
            - plugins/vite/**
            - plugins/rollup/**
            - examples/lib-prebuilt-matrix/**
            - examples/backend-nodejs-native/**
            - examples/native-executable/**
            - examples/desktop-electron/**
            - examples/desktop-app/**
            - examples/mobile-reactnative-cli/ci/**
            - .nvmrc
            - .github/workflows/test-node-native-sample.yml
            - '!**/*.md'

permissions: {}
concurrency:
    # A new push to a pull request supersedes its running checks; a main commit keeps its own run.
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true
jobs:
    build:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Restore cached bridge files
              # A macOS runner has no Docker and cannot run SWIG, so the bridges come from committed
              # snapshots; regenerate them when the headers or the SWIG fork change. desktop-electron
              # binds the same native.h as backend-nodejs-native, and desktop-app imports Native from it by
              # name as mobile-reactnative-cli does, so each takes that example's snapshot under its paths.
              run: |
                  mkdir -p ./examples/lib-prebuilt-matrix/.crossbind ./examples/backend-nodejs-native/.crossbind ./examples/desktop-electron/.crossbind ./examples/desktop-app/.crossbind
                  cp -r ./examples/backend-nodejs-native/ci/lib-prebuilt-matrix-snapshot/. ./examples/lib-prebuilt-matrix/.crossbind/
                  cp -r ./examples/backend-nodejs-native/ci/crossbind-snapshot/. ./examples/backend-nodejs-native/.crossbind/
                  cp -r ./examples/backend-nodejs-native/ci/crossbind-snapshot/. ./examples/desktop-electron/.crossbind/
                  cp -r ./examples/mobile-reactnative-cli/ci/crossbind-snapshot/. ./examples/desktop-app/.crossbind/
                  sed -i '' 's#/examples/backend-nodejs-native/#/examples/desktop-electron/#g' ./examples/desktop-electron/.crossbind/cache.json
                  sed -i '' 's#/examples/mobile-reactnative-cli/#/examples/desktop-app/#g' ./examples/desktop-app/.crossbind/cache.json
            - name: Build examples/lib-prebuilt-matrix
              run: pnpm --filter=@crossbind/example-lib-prebuilt-matrix run build:darwin
            - name: Build examples/backend-nodejs-native
              run: pnpm --filter=@crossbind/example-backend-nodejs-native run build
            - name: Run the addon from CommonJS and ESM
              run: pnpm --filter=@crossbind/example-backend-nodejs-native run e2e:prod
            # An executable has no bindings, so it builds with Xcode alone.
            - name: Build and run examples/native-executable
              run: |
                  pnpm --filter=@crossbind/example-native-executable run build
                  pnpm --filter=@crossbind/example-native-executable run e2e:prod
            - name: Build examples/desktop-electron and run it from its sources and packaged
              run: |
                  pnpm --filter=@crossbind/example-desktop-electron run build
                  pnpm --filter=@crossbind/example-desktop-electron run e2e:dev
                  pnpm --filter=@crossbind/example-desktop-electron run e2e:prod
            - name: Build examples/desktop-app and run the packaged app
              run: |
                  pnpm --filter=@crossbind/example-desktop-app run build
                  pnpm --filter=@crossbind/example-desktop-app run e2e:prod
            - name: Build examples/desktop-app for iOS and run it in the Simulator
              env:
                  CROSSBIND_APP_PLATFORM: ios
              run: |
                  pnpm --filter=@crossbind/example-lib-prebuilt-matrix run build:ios
                  pnpm --filter=@crossbind/example-desktop-app run build
                  pnpm --filter=@crossbind/example-desktop-app run e2e:prod
    android-app:
        # The sample's Android app builds and packages in crossbind's android-app image, the library in the android image
        # it adds to, and runs on an emulator.
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Build examples/lib-prebuilt-matrix and examples/desktop-app for Android
              run: |
                  pnpm --filter=@crossbind/example-lib-prebuilt-matrix run build:android
                  pnpm --filter=@crossbind/example-desktop-app run build:android
            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            - name: Run examples/desktop-app on an emulator
              uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              env:
                  CROSSBIND_APP_PLATFORM: android
              with:
                  api-level: 36
                  target: default
                  arch: x86_64
                  emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                  disable-animations: true
                  script: pnpm --filter=@crossbind/example-desktop-app run e2e:prod
    windows-addons:
        # A hosted Windows runner cannot run the Linux image the win32 addons build in, so this
        # runner builds the ones the Windows runners load.
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Build the Windows addons of examples/desktop-electron
              run: |
                  pnpm --filter=@crossbind/example-lib-prebuilt-matrix exec crossbind build -p win32
                  pnpm --filter=@crossbind/example-desktop-electron exec crossbind build -p win32 -e node -b release
            - name: Keep the addons for the runners that load them
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: electron-windows-addons
                  if-no-files-found: error
                  # A re-run of this job uploads under the same name again.
                  overwrite: true
                  path: |
                      examples/desktop-electron/dist/*.node
                      examples/desktop-electron/dist/*.cjs
                  retention-days: 1
    electron-windows:
        needs: windows-addons
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { runner: windows-latest, arch: x64 }
                    - { runner: windows-11-arm, arch: arm64 }
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
                  # Electron and electron-builder take Node's arch: an emulated x64 Node.js would run
                  # the x64 app on the arm64 runner.
                  architecture: ${{ matrix.arch }}
            - name: Install the app's dependencies
              run: pnpm install --filter=@crossbind/example-desktop-electron...
            - name: Restore the addons
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: electron-windows-addons
                  path: examples/desktop-electron/dist
            - name: Run examples/desktop-electron from its sources and packaged
              run: |
                  pnpm --filter=@crossbind/example-desktop-electron run e2e:dev
                  pnpm --filter=@crossbind/example-desktop-electron run e2e:prod
