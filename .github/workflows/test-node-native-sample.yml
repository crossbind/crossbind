name: test node native sample
on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - core/**
            - extensions/**
            - examples/**
            - plugins/vite/**
            - plugins/rollup/**
            - tooling/bridge-tools/**
            - .nvmrc
            - .github/workflows/test-node-native-sample.yml
            - .github/workflows/build-bridge-tools.yml
            - '!**/*.md'
    pull_request:
        branches:
            - main
        paths:
            - core/crossbind/**
            - core/embind-jsi/**
            - core/embind-napi/**
            - core/app-host/**
            - extensions/**
            - plugins/vite/**
            - plugins/rollup/**
            - examples/lib-prebuilt-matrix/**
            - examples/backend-nodejs-native/**
            - examples/native-executable/**
            - examples/desktop-electron/**
            - examples/desktop-app/**
            - tooling/bridge-tools/**
            - .nvmrc
            - .github/workflows/test-node-native-sample.yml
            - .github/workflows/build-bridge-tools.yml
            - '!**/*.md'

permissions: {}
concurrency:
    # A newer push to the same pull request or branch supersedes the running checks.
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
jobs:
    tested:
        uses: ./.github/workflows/tested-tree.yml
        permissions:
            actions: read
            contents: read
            pull-requests: read
        with:
            workflow: test-node-native-sample.yml
    # The macOS builds make their bridges with bridge-tools, as a developer's Mac does.
    bridge-tools:
        needs: tested
        if: needs.tested.outputs.tested != 'true'
        uses: ./.github/workflows/build-bridge-tools.yml
    build:
        needs: bridge-tools
        runs-on: macos-latest
        # main's pushes alone reach the ci-cache environment, whose secrets write the compiler cache; it records no deployment.
        environment:
            name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ci-cache' || '' }}
            deployment: false
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            # crossbind opens examples/desktop-app in a Simulator already booted, so it boots while the job builds.
            - name: Boot an iPhone Simulator of the newest iOS
              run: |
                  udid=$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries[] | select(.key | contains(".SimRuntime.iOS-")) | (.key | split(".SimRuntime.iOS-")[1] | split("-") | map(tonumber)) as $version | .value[] | select(.name | startswith("iPhone")) | {udid, $version}] | sort_by(.version) | last | .udid')
                  xcrun simctl boot "$udid"
                  echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
            - name: Install pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Set up the compiler cache
              uses: ./.github/actions/setup-sccache
              with:
                  read-key-id: ${{ secrets.SCCACHE_R2_READ_KEY_ID }}
                  read-secret: ${{ secrets.SCCACHE_R2_READ_SECRET }}
                  write-key-id: ${{ secrets.SCCACHE_R2_WRITE_KEY_ID }}
                  write-secret: ${{ secrets.SCCACHE_R2_WRITE_SECRET }}
                  endpoint: ${{ vars.SCCACHE_R2_ENDPOINT }}
            # Fetched once per version and kept: React Native's Maven repository has served Hermes at a crawl.
            - name: Restore Hermes
              id: hermes
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.crossbind/hermes
                  key: hermes-${{ runner.os }}-${{ hashFiles('core/crossbind/src/utils/hermes.js') }}
            - name: Fetch Hermes
              if: steps.hermes.outputs.cache-hit != 'true'
              timeout-minutes: 15
              run: node --input-type=module -e "await (await import('./core/crossbind/src/utils/hermes.js')).default()"
            - name: Save Hermes
              if: steps.hermes.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.crossbind/hermes
                  key: ${{ steps.hermes.outputs.cache-primary-key }}
            - name: Restore the bridge tools
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: bridge-tools
                  path: tooling/bridge-tools/dist
            - name: Build examples/lib-prebuilt-matrix
              run: pnpm --filter=@crossbind/example-lib-prebuilt-matrix run build:darwin
            - name: Build examples/backend-nodejs-native
              run: pnpm --filter=@crossbind/example-backend-nodejs-native run build
            - name: Run the addon from CommonJS and ESM
              run: pnpm --filter=@crossbind/example-backend-nodejs-native run e2e:prod
            # An executable has no bindings, so it builds with Xcode alone.
            - name: Build and run examples/native-executable
              run: |
                  pnpm --filter=@crossbind/example-native-executable run build
                  pnpm --filter=@crossbind/example-native-executable run e2e:prod
            - name: Build examples/desktop-electron and run it from its sources and packaged
              run: |
                  pnpm --filter=@crossbind/example-desktop-electron run build
                  pnpm --filter=@crossbind/example-desktop-electron run e2e:dev
                  pnpm --filter=@crossbind/example-desktop-electron run e2e:prod
            - name: Build examples/desktop-app and run the packaged app
              run: |
                  pnpm --filter=@crossbind/example-desktop-app run build
                  pnpm --filter=@crossbind/example-desktop-app run e2e:prod
            # simctl boot returns while the device is still booting, which crossbind would boot again.
            - name: Wait for the Simulator to finish booting
              run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b
            - name: Build examples/desktop-app for iOS and run it in the Simulator
              env:
                  CROSSBIND_APP_PLATFORM: ios
              run: |
                  pnpm --filter=@crossbind/example-lib-prebuilt-matrix run build:ios
                  pnpm --filter=@crossbind/example-desktop-app run build
                  pnpm --filter=@crossbind/example-desktop-app run e2e:prod
            # sccache finishes the cache writes it still holds as it stops, and reports what the job took from the cache.
            - name: Stop the compiler cache
              if: ${{ always() && env.CROSSBIND_SCCACHE == '1' }}
              run: sccache --stop-server || echo "No sccache server ran in this job."
    android-app:
        needs: tested
        if: needs.tested.outputs.tested != 'true'
        # The sample's Android app builds and packages in crossbind's android-app image, the library in the android image
        # it adds to, and runs on an emulator.
        runs-on: ubuntu-latest
        # main's pushes alone reach the ci-cache environment, whose secrets write the compiler cache; it records no deployment.
        environment:
            name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ci-cache' || '' }}
            deployment: false
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Set up the compiler cache
              uses: ./.github/actions/setup-sccache
              with:
                  read-key-id: ${{ secrets.SCCACHE_R2_READ_KEY_ID }}
                  read-secret: ${{ secrets.SCCACHE_R2_READ_SECRET }}
                  write-key-id: ${{ secrets.SCCACHE_R2_WRITE_KEY_ID }}
                  write-secret: ${{ secrets.SCCACHE_R2_WRITE_SECRET }}
                  endpoint: ${{ vars.SCCACHE_R2_ENDPOINT }}
            - name: Build examples/lib-prebuilt-matrix and examples/desktop-app for Android
              run: |
                  pnpm --filter=@crossbind/example-lib-prebuilt-matrix run build:android
                  pnpm --filter=@crossbind/example-desktop-app run build:android
            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            - name: Run examples/desktop-app on an emulator
              uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              env:
                  CROSSBIND_APP_PLATFORM: android
              with:
                  api-level: 36
                  target: default
                  arch: x86_64
                  emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                  disable-animations: true
                  script: pnpm --filter=@crossbind/example-desktop-app run e2e:prod
    windows-addons:
        needs: tested
        if: needs.tested.outputs.tested != 'true'
        # A hosted Windows runner cannot run the Linux image the win32 addons build in, so this
        # runner builds the ones the Windows runners load.
        runs-on: ubuntu-latest
        # main's pushes alone reach the ci-cache environment, whose secrets write the compiler cache; it records no deployment.
        environment:
            name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ci-cache' || '' }}
            deployment: false
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Set up the compiler cache
              uses: ./.github/actions/setup-sccache
              with:
                  read-key-id: ${{ secrets.SCCACHE_R2_READ_KEY_ID }}
                  read-secret: ${{ secrets.SCCACHE_R2_READ_SECRET }}
                  write-key-id: ${{ secrets.SCCACHE_R2_WRITE_KEY_ID }}
                  write-secret: ${{ secrets.SCCACHE_R2_WRITE_SECRET }}
                  endpoint: ${{ vars.SCCACHE_R2_ENDPOINT }}
            - name: Build the Windows addons of examples/desktop-electron
              run: |
                  pnpm --filter=@crossbind/example-lib-prebuilt-matrix exec crossbind build -p win32
                  pnpm --filter=@crossbind/example-desktop-electron exec crossbind build -p win32 -e node -b release
            - name: Keep the addons for the runners that load them
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: electron-windows-addons
                  if-no-files-found: error
                  # A re-run of this job uploads under the same name again.
                  overwrite: true
                  path: |
                      examples/desktop-electron/dist/*.node
                      examples/desktop-electron/dist/*.cjs
                  retention-days: 1
    electron-windows:
        needs: windows-addons
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { runner: windows-latest, arch: x64 }
                    - { runner: windows-11-arm, arch: arm64 }
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
                  # Electron and electron-builder take Node's arch: an emulated x64 Node.js would run
                  # the x64 app on the arm64 runner.
                  architecture: ${{ matrix.arch }}
            - name: Install the app's dependencies
              run: pnpm install --filter=@crossbind/example-desktop-electron...
            - name: Restore the addons
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: electron-windows-addons
                  path: examples/desktop-electron/dist
            - name: Run examples/desktop-electron from its sources and packaged
              run: |
                  pnpm --filter=@crossbind/example-desktop-electron run e2e:dev
                  pnpm --filter=@crossbind/example-desktop-electron run e2e:prod
