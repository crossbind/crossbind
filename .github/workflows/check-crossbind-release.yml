name: Check npm release infrastructure

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - .nvmrc
            - .github/workflows/**
            - package.json
            - pnpm-lock.yaml
            - scripts/release/**
            - scripts/site/**
            - scripts/pin-docker-image.js
            - scripts/pin-rust-sysroot.js
            - scripts/gate-pinned-local-sysroot.mjs
            - releases/**
            - CHANGELOG.md
            - core/**/package.json
            - tooling/**/package.json
            - plugins/**/package.json
            - ports/**/package.json
            - examples/**/package.json
            - core/crossbind/src/assets/toolchain-digests.json
            - core/crossbind/src/utils/pullDockerImage.js
            - core/crossbind/src/utils/rustSysrootPin.js
            - tooling/docker/VERSION
            - landing/**
    pull_request:
        branches:
            - main
        paths:
            - .nvmrc
            - .github/workflows/**
            - package.json
            - pnpm-lock.yaml
            - scripts/release/**
            - scripts/site/**
            - scripts/pin-docker-image.js
            - scripts/pin-rust-sysroot.js
            - scripts/gate-pinned-local-sysroot.mjs
            - releases/**
            - CHANGELOG.md
            - core/**/package.json
            - tooling/**/package.json
            - plugins/**/package.json
            - ports/**/package.json
            - examples/**/package.json
            - core/crossbind/src/assets/toolchain-digests.json
            - core/crossbind/src/utils/pullDockerImage.js
            - core/crossbind/src/utils/rustSysrootPin.js
            - tooling/docker/VERSION
            - landing/**

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Validate release code and workflow semantics
              run: pnpm run check:release
            - name: Build the site from the offline release fixture
              env:
                  CROSSBIND_SITE_RELEASE_FIXTURE: ${{ github.workspace }}/scripts/release/test/fixtures/site-release/beta.json
              run: pnpm --filter @crossbind/landing build
            - name: Refuse to deploy a fixture-built site
              run: |
                  if node scripts/release/check-site-snapshot.mjs landing/dist/release-snapshot.json; then
                      echo 'the deploy gate accepted a fixture build' >&2
                      exit 1
                  fi
            - name: Check site links, anchors, redirects and routes
              run: node scripts/site/check-site-links.mjs landing/dist
            - name: Validate site scripts
              run: pnpm run check:site
            - name: Verify repository publish hygiene
              env:
                  NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
              run: pnpm run check:publish
            - name: Gate pinned toolchains and a representative Web build
              run: pnpm run check:release:toolchain
            - name: Build and consume the canonical crossbind npm tarball
              run: node scripts/release/package-crossbind.mjs
