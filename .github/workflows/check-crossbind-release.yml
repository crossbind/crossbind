name: Check npm release infrastructure

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - .nvmrc
            - .github/workflows/**
            - package.json
            - pnpm-lock.yaml
            - scripts/release/**
            - scripts/pin-docker-image.js
            - scripts/pin-rust-sysroot.js
            - scripts/gate-pinned-local-sysroot.mjs
            - releases/**
            - core/**/package.json
            - tooling/**/package.json
            - plugins/**/package.json
            - ports/**/package.json
            - examples/**/package.json
            - core/crossbind/src/assets/toolchain-digests.json
            - core/crossbind/src/utils/pullDockerImage.js
            - core/crossbind/src/utils/rustSysrootPin.js
            - tooling/docker/VERSION
    pull_request:
        branches:
            - main
        paths:
            - .nvmrc
            - .github/workflows/**
            - package.json
            - pnpm-lock.yaml
            - scripts/release/**
            - scripts/pin-docker-image.js
            - scripts/pin-rust-sysroot.js
            - scripts/gate-pinned-local-sysroot.mjs
            - releases/**
            - core/**/package.json
            - tooling/**/package.json
            - plugins/**/package.json
            - ports/**/package.json
            - examples/**/package.json
            - core/crossbind/src/assets/toolchain-digests.json
            - core/crossbind/src/utils/pullDockerImage.js
            - core/crossbind/src/utils/rustSysrootPin.js
            - tooling/docker/VERSION

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Validate release code and workflow semantics
              run: pnpm run check:release
            - name: Verify repository publish hygiene
              env:
                  NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
              run: pnpm run check:publish
            - name: Gate pinned toolchains and a representative Web build
              run: pnpm run check:release:toolchain
            - name: Build and consume the canonical crossbind npm tarball
              run: node scripts/release/package-crossbind.mjs
