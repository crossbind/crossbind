name: test conan node addons
on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - core/crossbind/**
            - core/embind-jsi/**
            - core/embind-napi/**
            - e2e/backend-nodejs-native-conan/**
            - .nvmrc
            - .github/workflows/test-conan-node-addons.yml
            - '!**/*.md'
    pull_request:
        branches:
            - main
        paths:
            - core/crossbind/**
            - core/embind-jsi/**
            - core/embind-napi/**
            - e2e/backend-nodejs-native-conan/**
            - .nvmrc
            - .github/workflows/test-conan-node-addons.yml
            - '!**/*.md'

permissions: {}
concurrency:
    # A new push to a pull request supersedes its running checks; a main commit keeps its own run.
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true
jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Build the Linux and Windows addons
              # The linux and windows images build every Conan package from source: ConanCenter has no
              # binaries for their toolchains.
              run: pnpm run ci:linux:build:conan
            - name: Keep the addons for the runners that load them
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: conan-node-addons
                  if-no-files-found: error
                  # A re-run of this job uploads under the same name again.
                  overwrite: true
                  path: |
                      e2e/backend-nodejs-native-conan/dist/*.node
                      e2e/backend-nodejs-native-conan/dist/*.cjs
                  retention-days: 1
    run:
        # Linux runs the glibc and musl addons in containers; a hosted Windows runner cannot run the
        # Linux images, so each Windows runner loads the addon built for it.
        needs: build
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { runner: ubuntu-latest, arch: x64 }
                    - { runner: windows-latest, arch: x64 }
                    - { runner: windows-11-arm, arch: arm64 }
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  # An emulated x64 Node.js would load the x64 addon on the arm64 runner.
                  architecture: ${{ matrix.arch }}
            - name: Restore the addons
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: conan-node-addons
                  path: e2e/backend-nodejs-native-conan/dist
            - name: Run the addons
              run: node e2e/backend-nodejs-native-conan/e2e/run.mjs
