name: test core
on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - core/crossbind/**
            - ports/**
            - .nvmrc
            - .github/workflows/test-core.yml
            - '!**/*.md'
    pull_request:
        branches:
            - main
        paths:
            - core/crossbind/**
            - ports/**
            - .nvmrc
            - .github/workflows/test-core.yml
            - '!**/*.md'

permissions: {}
concurrency:
    # A new push to a pull request supersedes its running checks; a main commit keeps its own run.
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true
jobs:
    unit:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Unit tests with coverage thresholds
              if: matrix.os == 'ubuntu-latest'
              run: pnpm --filter crossbind test:coverage
            - name: Unit tests
              if: matrix.os == 'windows-latest'
              run: pnpm --filter crossbind test
            - name: License SPDX check
              if: matrix.os == 'ubuntu-latest'
              working-directory: e2e/web-vanilla
              run: node ../../core/crossbind/src/bin.js licenses --check
