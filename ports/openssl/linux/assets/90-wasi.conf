#| -*- mode: perl; -*-
#| Configure target for platform:'wasi' (wasm32-wasip3, wasi-sdk >= 34).
#| The toolchain (CC/CXX/AR/RANLIB) and every flag - --target, the wasi
#| emulation defines, the wasm-EH set - arrive through the environment the
#| crossbind build exports, so this target only pins what the environment
#| cannot: static-only layout, 32-bit bignum words and the WASI sys_id
#| (no fork/exec, no UNIX sockets, no perlasm).
my %targets = (
    "wasi-p3" => {
        inherit_from     => [ "BASE_unix" ],
        sys_id           => "WASI",
        bn_ops           => "THIRTY_TWO_BIT",
        thread_scheme    => "(unknown)",
        perlasm_scheme   => "void",
        shared_target    => "",
        shared_extension => "",
    },
);
